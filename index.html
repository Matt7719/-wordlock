<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e8e1d2">
<title>WORDLOCK 018</title>

<style>
:root{
  --ink:#20211f;
  --remembered:#353733;
  --alternative:#6d716c;
  --cream:rgba(248,246,237,.91);

  --sage:#aec1ad;
  --blue:#a9c3ca;
  --ochre:#d0b77f;
  --mauve:#bca9be;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  min-height:100%;
  background:#e7dfcf;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Avenir Next","Segoe UI",sans-serif;
}

body{overflow-x:hidden}

button,input{font:inherit}
button{touch-action:manipulation}

#place{
  min-height:100vh;
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(145deg,#eadfc9 0%,#ddd1b7 55%,#d6c9aa 100%);
}

/* =====================================================
   THE PLACE
   One continuous landscape, not wallpaper behind a card
===================================================== */

.terrain{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

/* subtle overall land variation */
.landwash{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at 76% 19%,
      rgba(174,185,156,.23) 0%,
      rgba(174,185,156,.08) 28%,
      transparent 50%),
    radial-gradient(ellipse at 18% 72%,
      rgba(178,157,122,.19) 0%,
      transparent 45%);
}

/* Actual contour lines */
.contour-svg{
  position:absolute;
  width:150%;
  height:1100px;
  left:-25%;
  top:100px;
  opacity:.58;
}

.contour-svg path{
  fill:none;
  stroke:#706e61;
  stroke-width:1.25;
  vector-effect:non-scaling-stroke;
}

.contour-svg path.fine{
  stroke-width:.75;
  opacity:.55;
}

/* WATER: recognisable, but part of terrain */
.water{
  position:absolute;
  left:-5%;
  top:700px;
  width:67%;
  height:220px;
  transform:rotate(-8deg);
  border-radius:46% 54% 49% 51%;

  background:
    repeating-linear-gradient(
      3deg,
      transparent 0 14px,
      rgba(88,137,145,.13) 15px,
      transparent 16px 28px
    ),
    radial-gradient(
      ellipse at 45% 52%,
      rgba(90,153,164,.48),
      rgba(112,157,160,.30) 52%,
      rgba(118,150,150,.08) 72%,
      transparent 76%
    );

  border-top:1px solid rgba(77,112,114,.27);
  border-bottom:1px solid rgba(77,112,114,.18);
}

/* shoreline echoes */
.water::before,
.water::after{
  content:"";
  position:absolute;
  border:1px solid rgba(83,101,98,.22);
  border-radius:50%;
  inset:-15px -28px;
}

.water::after{
  inset:-29px -50px;
  opacity:.55;
}

/* VEGETATION: texture rather than green paint */
.vegetation{
  position:absolute;
  right:-8%;
  top:390px;
  width:55%;
  height:430px;

  background:
    radial-gradient(circle at 70% 45%,
      rgba(107,137,91,.30),
      rgba(120,145,101,.13) 42%,
      transparent 70%);
}

.vegetation::before{
  content:"";
  position:absolute;
  inset:0;

  background-image:
    radial-gradient(circle,rgba(67,92,61,.34) 0 1.1px,transparent 1.5px),
    radial-gradient(circle,rgba(83,106,72,.25) 0 1px,transparent 1.4px);

  background-size:19px 21px,31px 27px;
  background-position:0 0,11px 7px;

  mask-image:radial-gradient(ellipse at 65% 45%,black 5%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at 65% 45%,black 5%,transparent 72%);
}

/* subtle exposed stone */
.stone{
  position:absolute;
  width:150px;
  height:210px;
  right:-28px;
  top:810px;

  border-radius:54% 46% 57% 43%;

  background:
    linear-gradient(135deg,
      rgba(154,137,110,.20),
      rgba(120,111,95,.35));

  box-shadow:
    inset 14px 9px 25px rgba(255,255,255,.10),
    inset -10px -12px 25px rgba(79,73,63,.10);
}

.stone2{
  position:absolute;
  width:120px;
  height:105px;
  left:-35px;
  top:590px;
  border-radius:45% 55% 48% 52%;

  background:
    linear-gradient(150deg,
      rgba(150,136,112,.25),
      rgba(117,108,92,.30));
}

/* ambiguous old track */
.track{
  position:absolute;
  width:90%;
  height:390px;
  left:25%;
  top:520px;
  border-left:2px solid rgba(236,229,207,.33);
  border-radius:48%;
  transform:rotate(24deg);
}

.track::after{
  content:"";
  position:absolute;
  inset:0 0 0 8px;
  border-left:1px solid rgba(236,229,207,.23);
  border-radius:48%;
}

/* ===================================================== */

.wrap{
  position:relative;
  z-index:2;
  width:min(94vw,520px);
  margin:0 auto;

  padding:
    max(32px,env(safe-area-inset-top))
    0
    max(45px,env(safe-area-inset-bottom));
}

header{
  text-align:center;
  margin:25px 0 27px;
}

.brand{
  font-size:14px;
  font-weight:800;
  letter-spacing:.36em;
}

.where{
  margin-top:12px;
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
}

.terrain-note{
  margin-top:5px;
  font-family:Georgia,serif;
  font-size:15px;
  color:#5e5d54;
}

/* No containing game card */

.clue-area{
  text-align:center;
  min-height:112px;
  padding:12px 10px;
}

.progress{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:14px;
}

.progress-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  border:1px solid rgba(61,63,58,.65);
  background:rgba(250,247,237,.52);
}

.progress-dot.done:nth-child(1){background:var(--sage);border-color:transparent}
.progress-dot.done:nth-child(2){background:var(--blue);border-color:transparent}
.progress-dot.done:nth-child(3){background:var(--ochre);border-color:transparent}
.progress-dot.done:nth-child(4){background:var(--mauve);border-color:transparent}

.clue-label{
  font-size:9px;
  font-weight:800;
  letter-spacing:.25em;
  color:#62645e;
}

#clue{
  margin:7px auto 4px;
  max-width:390px;
  min-height:29px;

  font-family:Georgia,serif;
  font-size:20px;
  line-height:1.25;
}

#length{
  font-size:10px;
  letter-spacing:.22em;
  color:#666861;
}

/* =====================================================
   REELS
===================================================== */

.board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px 8px;
  padding:10px 9px 6px;
}

/* subtle terrain visibility immediately beneath board */
.board::before{
  content:"";
  position:absolute;
  inset:-16px -10px;
  border-radius:32px;

  background:
    radial-gradient(
      ellipse at 50% 48%,
      rgba(239,231,211,.11),
      transparent 73%
    );

  pointer-events:none;
}

.reel{
  position:relative;
  z-index:1;

  height:76px;

  /*
    Softer than 017, but still geometric.
    Definitely not pills.
  */
  border-radius:17px;

  border:1px solid rgba(64,66,60,.22);

  background:var(--cream);

  box-shadow:
    0 5px 12px rgba(55,51,43,.11),
    inset 0 1px 0 rgba(255,255,255,.82);

  overflow:hidden;

  user-select:none;
  -webkit-user-select:none;
  touch-action:pan-y;

  transition:
    background .55s ease,
    transform .25s ease,
    box-shadow .35s ease;
}

.reel-inner{
  height:100%;
  display:grid;
  grid-template-columns:1fr 1.28fr 1fr;
  align-items:center;
  text-align:center;
}

.letter{
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
}

/* unused but CLEAR */
.letter.alt{
  font-size:17px;
  font-weight:500;
  color:var(--alternative);
}

/* previously used */
.letter.alt.remembered{
  color:var(--remembered);
  font-weight:800;
}

/* current */
.letter.current{
  font-size:31px;
  font-weight:850;
  color:var(--ink);
}

/* colour history */
.reel.used1{background:rgba(174,193,173,.92)}
.reel.used2{background:rgba(169,195,202,.92)}
.reel.used3{background:rgba(208,183,127,.92)}
.reel.used4{background:rgba(188,169,190,.92)}

.reel.mix12{
  background:linear-gradient(135deg,var(--sage),var(--blue));
}
.reel.mix13{
  background:linear-gradient(135deg,var(--sage),var(--ochre));
}
.reel.mix14{
  background:linear-gradient(135deg,var(--sage),var(--mauve));
}
.reel.mix23{
  background:linear-gradient(135deg,var(--blue),var(--ochre));
}
.reel.mix24{
  background:linear-gradient(135deg,var(--blue),var(--mauve));
}
.reel.mix34{
  background:linear-gradient(135deg,var(--ochre),var(--mauve));
}

.reel.confirming{
  transform:scale(1.045);
  box-shadow:
    0 0 0 3px rgba(255,255,255,.36),
    0 7px 16px rgba(50,48,42,.13);
}

.reel.pulse{
  animation:pulse 1.05s ease-in-out 2;
}

@keyframes pulse{
  50%{
    transform:scale(1.055);
    box-shadow:
      0 0 0 4px rgba(60,65,58,.11),
      0 7px 16px rgba(50,48,42,.13);
  }
}

/* ===================================================== */

.controls{
  display:grid;
  grid-template-columns:1fr 1.65fr 1fr;
  gap:9px;
  padding:0 9px;
  margin-top:16px;
}

.btn{
  min-height:49px;
  border:1px solid rgba(52,54,50,.42);
  border-radius:16px;

  background:rgba(247,243,232,.83);

  color:#343632;

  font-size:10px;
  font-weight:800;
  letter-spacing:.14em;
}

.btn.primary{
  background:#30322e;
  color:#f8f5eb;
  border-color:#30322e;
}

.btn:active{
  transform:translateY(1px);
}

#message{
  min-height:36px;
  padding-top:10px;

  text-align:center;

  font-family:Georgia,serif;
  font-style:italic;
  font-size:14px;

  color:#55584f;
}

.bank{
  min-height:38px;
  margin-top:5px;

  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
}

.pill{
  opacity:0;
  transform:translateY(5px);

  padding:7px 12px;
  border-radius:999px;

  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;

  animation:pillIn .55s ease forwards;
}

@keyframes pillIn{
  to{
    opacity:1;
    transform:none;
  }
}

.pill.c1{background:var(--sage)}
.pill.c2{background:var(--blue)}
.pill.c3{background:var(--ochre)}
.pill.c4{background:var(--mauve)}

.stats{
  display:flex;
  justify-content:center;
  gap:22px;

  margin-top:8px;

  font-size:9px;
  font-weight:800;
  letter-spacing:.14em;

  color:#565951;
}

/* =====================================================
   CONNECTION
===================================================== */

.connection{
  display:none;

  margin:28px 10px 0;
  padding:25px 12px 22px;

  border-top:1px solid rgba(64,66,59,.25);

  text-align:center;
}

.connection.show{
  display:block;
  animation:gentleIn .75s ease both;
}

@keyframes gentleIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.connection-title{
  font-size:9px;
  font-weight:800;
  letter-spacing:.27em;
  color:#5c5f58;
}

.connection-copy{
  margin:8px 0 12px;

  font-family:Georgia,serif;
  font-size:20px;
}

.connection-words{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
}

.connection-length{
  margin:15px 0 6px;

  font-size:20px;
  font-weight:800;
  letter-spacing:.32em;

  color:#55584f;
}

.connection-input{
  width:min(250px,82%);

  border:0;
  border-bottom:1px solid #696b63;
  border-radius:0;

  background:transparent;

  padding:8px;

  outline:none;

  text-align:center;
  text-transform:uppercase;

  font-size:23px;
  font-weight:800;
  letter-spacing:.14em;

  color:#252724;
}

.connection-actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;

  margin-top:14px;
}

.connection-actions .btn{
  padding:0 17px;
}

#connectionHint{
  max-width:340px;
  min-height:46px;

  margin:13px auto 0;

  font-family:Georgia,serif;
  font-style:italic;
  font-size:14px;
  line-height:1.4;

  color:#55584f;
}

/* =====================================================
   COMPLETION
===================================================== */

.final{
  display:none;
  margin:27px 12px 0;
  padding:25px 10px;
  text-align:center;
}

.final.show{
  display:block;
  animation:gentleIn 1.2s ease both;
}

.final-kicker{
  font-size:9px;
  font-weight:800;
  letter-spacing:.27em;
}

.final-title{
  margin-top:8px;

  font-family:Georgia,serif;
  font-size:28px;
}

.final-copy{
  margin:8px auto;
  max-width:320px;

  font-family:Georgia,serif;
  font-size:15px;
  line-height:1.5;

  color:#50534c;
}

.final-path{
  margin-top:16px;

  font-size:10px;
  font-weight:800;
  letter-spacing:.15em;
}

/* ===================================================== */

.shake{
  animation:shake .28s linear;
}

@keyframes shake{
  25%{transform:translateX(-4px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-2px)}
}

@media(max-width:390px){
  .board{gap:10px 7px}
  .reel{height:70px;border-radius:15px}
  .letter.alt{font-size:16px}
  .letter.current{font-size:29px}
  #clue{font-size:19px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div id="place">

  <div class="terrain">

    <div class="landwash"></div>

    <svg class="contour-svg"
         viewBox="0 0 700 1100"
         preserveAspectRatio="none"
         aria-hidden="true">

      <path d="M-50 150
               C100 45 280 60 365 160
               C450 260 600 230 760 110"/>

      <path d="M-60 190
               C105 85 260 90 340 185
               C425 285 585 280 760 155"/>

      <path class="fine"
            d="M-80 235
               C90 130 245 135 320 220
               C405 315 570 330 770 200"/>

      <path d="M-80 390
               C80 320 175 360 250 430
               C345 520 490 485 760 350"/>

      <path class="fine"
            d="M-90 425
               C65 355 170 400 235 465
               C330 555 500 525 770 390"/>

      <path d="M-90 610
               C80 525 245 535 355 640
               C470 750 600 735 770 610"/>

      <path class="fine"
            d="M-90 650
               C85 570 245 575 335 675
               C445 795 605 775 770 650"/>

      <path d="M-100 835
               C85 745 280 750 390 860
               C500 970 630 950 780 820"/>

               C475 1015 620 1010 780 875"/>

  <main class="wrap">

    <header>
      <div class="brand">WORDLOCK</div>

    </header>

    <section class="clue-area" id="clueArea">

      <div class="progress">
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
      </div>

      <div class="clue-label" id="clueLabel">CLUE 1</div>
      <div id="clue"></div>
      <div id="length"></div>

    </section>

    <div class="board" id="board"></div>

    <div class="controls" id="controls">
      <button class="btn" id="resetBtn">RESET</button>
      <button class="btn primary" id="unlockBtn">UNLOCK</button>

        id="connectionInput"

        This place is a little different because you passed through it.
      </div>

      <div class="final-path" id="finalPath"></div>

    </section>

  </main>
</div>

<script>

/* =========================================================
   WORDLOCK 018
========================================================= */

const PUZZLE={

  wheels:[

    ["M","N","C"],
    ["I","A","R"],
    ["F","O","D"],
    ["T","S","P"],

    ["E","G","B"],
    ["L","E","Y"],
    ["K","X","V"],
    ["O","J","U"],

    ["L","Q","H"],
    ["I","X","A"],
    ["M","U","S"],
    ["R","W","N"],

    ["R","D","F"],
    ["B","N","G"],
    ["C","T","P"],
    ["H","V","K"]
  ],

  clues:[

    {
      answer:"MILE",
      clue:"A unit used to measure distance",
      start:0,
      colour:1
    },

    {
      answer:"GEM",
      clue:"A precious or beautiful stone",
      start:4,
      colour:2
    },

    {
      answer:"LIME",
      clue:"A small green citrus fruit",
      start:8,
      colour:3
    },

    {
      answer:"TOUCH",
      clue:"A light contact with a hand or finger",
      start:3,
      colour:4
    }

  ],

  connection:{

    answer:"STONE",

    hint1:
      "The connecting word comes after all four answers.",

    hint2:
      "Think of something ancient, solid and shaped by time.",

    hint3:
      "It can mark a distance, be precious, form rock — or become a point of reference."
  }

};


/* =========================================================
   STATE
========================================================= */

let clueIndex=0;

let current=PUZZLE.wheels.map(()=>1);

let clueSnapshot=[...current];

let remembered=PUZZLE.wheels.map(()=>new Set());

let histories=PUZZLE.wheels.map(()=>new Set());

let solvedWords=[];

let turns=0;
let attempts=0;
let hints=0;

let connectionHintLevel=0;

let busy=false;


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function ensureAudio(){

  const AC=
    window.AudioContext||
    window.webkitAudioContext;

  if(!AC)return;

  if(!audioCtx){
    audioCtx=new AC();
  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }
}

function tone(freq,duration=.06,volume=.025){

  ensureAudio();

  if(!audioCtx)return;

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o.type="sine";

  o.frequency.setValueAtTime(
    freq,
    audioCtx.currentTime
  );

  g.gain.setValueAtTime(
    .0001,
    audioCtx.currentTime
  );

  g.gain.exponentialRampToValueAtTime(
    volume,
    audioCtx.currentTime+.008
  );

  g.gain.exponentialRampToValueAtTime(
    .0001,
    audioCtx.currentTime+duration
  );

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start();

  o.stop(
    audioCtx.currentTime+
    duration+.03
  );
}

function moveSound(){
  tone(145,.045,.018);
}

function wrongSound(){
  tone(88,.13,.025);
}

function pathSound(step){
  tone(175+(step*18),.09,.018);
}

function finishSound(){
  tone(196,.16,.02);
  setTimeout(()=>tone(247,.18,.02),120);
  setTimeout(()=>tone(294,.25,.018),260);
}


/* =========================================================
   HELPERS
========================================================= */

function letterAt(i){
  return PUZZLE.wheels[i][current[i]];
}

function adjacent(a,b){

  const ar=Math.floor(a/4);
  const ac=a%4;

  const br=Math.floor(b/4);
  const bc=b%4;

  return Math.max(
    Math.abs(ar-br),
    Math.abs(ac-bc)
  )===1;
}


function findPaths(word){

  const results=[];

  function walk(position,index,path){

    if(index===word.length){
      results.push([...path]);
      return;
    }

    for(let i=0;i<16;i++){

      if(path.includes(i))continue;

      if(letterAt(i)!==word[index])continue;

      if(
        position!==null &&
        !adjacent(position,i)
      )continue;

      path.push(i);

      walk(
        i,
        index+1,
        path
      );

      path.pop();
    }
  }

  walk(null,0,[]);

  return results;
}


/* =========================================================
   BOARD
========================================================= */

function render(){

  const board=
    document.getElementById("board");

  board.innerHTML="";

  PUZZLE.wheels.forEach((wheel,i)=>{

    const reel=
      document.createElement("div");

    reel.className="reel";

    applyHistory(reel,i);

    const centre=current[i];
    const left=(centre+2)%3;
    const right=(centre+1)%3;

    const inner=
      document.createElement("div");

    inner.className="reel-inner";

    [
      {idx:left,type:"alt"},
      {idx:centre,type:"current"},
      {idx:right,type:"alt"}
    ].forEach(item=>{

      const el=
        document.createElement("div");

      el.className=
        "letter "+item.type;

      const letter=
        wheel[item.idx];

      if(
        item.type==="alt" &&
        remembered[i].has(letter)
      ){
        el.classList.add("remembered");
      }

      el.textContent=letter;

      inner.appendChild(el);
    });

    reel.appendChild(inner);

    let startX=null;

    reel.addEventListener(
      "pointerdown",
      e=>{

        if(busy)return;

        ensureAudio();

        startX=e.clientX;

        reel.setPointerCapture?.(
          e.pointerId
        );
      }
    );

    reel.addEventListener(
      "pointerup",
      e=>{

        if(
          busy ||
          startX===null
        )return;

        const dx=
          e.clientX-startX;

        startX=null;

        if(Math.abs(dx)<16)return;

        turnReel(
          i,
          dx<0?1:-1
        );
      }
    );

    board.appendChild(reel);
  });

  updateStats();
}


function applyHistory(reel,i){

  const c=
    [...histories[i]];

  if(c.length===1){
    reel.classList.add(
      "used"+c[0]
    );
    return;
  }

  if(c.length>=2){

    const a=Math.min(...c);
    const b=Math.max(...c);

    const mix="mix"+a+b;

    if([
      "mix12","mix13","mix14",
      "mix23","mix24","mix34"
    ].includes(mix)){
      reel.classList.add(mix);
    }
  }
}


function turnReel(i,direction){

  if(busy)return;

  ensureAudio();

  current[i]=
    (current[i]+direction+3)%3;

  turns++;

  moveSound();

  render();
}


/* =========================================================
   CLUES
========================================================= */

function renderClue(){

  busy=false;

  const clue=
    PUZZLE.clues[clueIndex];

  document.getElementById(
    "clueLabel"
  ).textContent=
    "CLUE "+(clueIndex+1);

  document.getElementById(
    "clue"
  ).textContent=
    clue.clue;

  document.getElementById(
    "length"
  ).textContent=
    clue.answer.length+
    " LETTERS";

  document.getElementById(
    "message"
  ).textContent="";

  render();

  setTimeout(()=>{

    const reels=
      document.querySelectorAll(".reel");

    reels[
      clue.start
    ]?.classList.add("pulse");

  },350);
}


/* =========================================================
   UNLOCK
========================================================= */

function unlock(){

  if(busy)return;

  ensureAudio();

  attempts++;

  updateStats();

  const clue=
    PUZZLE.clues[clueIndex];

  const paths=
    findPaths(clue.answer);

  if(!paths.length){

    wrongSound();

    const board=
      document.getElementById("board");

    board.classList.add("shake");

    document.getElementById(
      "message"
    ).textContent=
      "Not quite. The place settles back.";

    busy=true;

    setTimeout(()=>{

      board.classList.remove("shake");

      current=[
        ...clueSnapshot
      ];

      render();

      busy=false;

    },650);

    return;
  }

  /*
    018 puzzle has been constructed so the
    valid solution state has one route.
  */

  solve(
    clue,
    paths[0]
  );
}


/* =========================================================
   SMOOTH SUCCESS SEQUENCE
========================================================= */

function solve(clue,path){

  busy=true;

  document.getElementById(
    "message"
  ).textContent="";

  /*
    First record remembered letters.
    Colour is added visually one place at a time.
  */

  path.forEach((position,n)=>{

    remembered[position].add(
      clue.answer[n]
    );

  });

  let step=0;

  function colourNext(){

    if(step>=path.length){

      setTimeout(
        ()=>completeWord(clue,path),
        320
      );

      return;
    }

    const position=
      path[step];

    histories[position].add(
      clue.colour
    );

    render();

    const reel=
      document.querySelectorAll(
        ".reel"
      )[position];

    reel?.classList.add(
      "confirming"
    );

    pathSound(step);

    setTimeout(()=>{

      reel?.classList.remove(
        "confirming"
      );

    },230);

    step++;

    setTimeout(
      colourNext,
      125
    );
  }

  colourNext();
}


function completeWord(clue,path){

  solvedWords.push(
    clue.answer
  );

  renderBank();

  document.querySelectorAll(
    ".progress-dot"
  )[clueIndex]
    .classList.add("done");

  document.getElementById(
    "message"
  ).textContent=
    clue.answer+" found.";

  /*
    Keep only the successful route's
    changes. Other experimentation
    settles back.
  */

  const next=[
    ...clueSnapshot
  ];

  path.forEach(i=>{
    next[i]=current[i];
  });

  current=next;

  clueSnapshot=[
    ...current
  ];

  clueIndex++;

  if(
    clueIndex>=
    PUZZLE.clues.length
  ){

    setTimeout(
      showConnection,
      850
    );

    return;
  }

  setTimeout(
    renderClue,
    800
  );
}


/* =========================================================
   RESET / HINT
========================================================= */

function reset(){

  if(busy)return;

  ensureAudio();

  current=[
    ...clueSnapshot
  ];

  render();

  document.getElementById(
    "message"
  ).textContent="";
}


function clueHint(){

  if(busy)return;

  hints++;

  updateStats();

  const clue=
    PUZZLE.clues[clueIndex];

  const reels=
    document.querySelectorAll(
      ".reel"
    );

  const r=
    reels[clue.start];

  r?.classList.remove("pulse");

  void r?.offsetWidth;

  r?.classList.add("pulse");

  document.getElementById(
    "message"
  ).textContent=
    "Start here.";
}


/* =========================================================
   BANK
========================================================= */

function renderBank(){

  const bank=
    document.getElementById("bank");

  bank.innerHTML="";

  solvedWords.forEach(
    (word,i)=>{

      const p=
        document.createElement("div");

      p.className=
        "pill c"+(i+1);

      p.textContent=word;

      bank.appendChild(p);
    }
  );
}


/* =========================================================
   CONNECTION
========================================================= */

function showConnection(){

  busy=false;

  document.getElementById(
    "controls"
  ).style.display="none";

  document.getElementById(
    "message"
  ).textContent="";

  document.getElementById(
    "clueArea"
  ).style.display="none";

  const connection=
    document.getElementById(
      "connection"
    );

  connection.classList.add(
    "show"
  );

  const words=
    document.getElementById(
      "connectionWords"
    );

  words.innerHTML="";

  solvedWords.forEach(
    (word,i)=>{

      const p=
        document.createElement("div");

      p.className=
        "pill c"+(i+1);

      p.textContent=word;

      words.appendChild(p);
    }
  );

  document.getElementById(
    "connectionLength"
  ).textContent=
    "•".repeat(
      PUZZLE.connection.answer.length
    );
}


function connectionHint(){

  ensureAudio();

  if(
    connectionHintLevel>=3
  )return;

  connectionHintLevel++;

  hints++;

  updateStats();

  document.getElementById(
    "connectionHint"
  ).textContent=
    PUZZLE.connection[
      "hint"+
      connectionHintLevel
    ];

  if(
    connectionHintLevel===3
  ){
    document.getElementById(
      "connectionHintBtn"
    ).textContent=
      "NO MORE HINTS";
  }
}


function tryConnection(){

  ensureAudio();

  const input=
    document.getElementById(
      "connectionInput"
    );

  const guess=
    input.value
      .trim()
      .toUpperCase();

  if(!guess)return;

  attempts++;

  updateStats();

  if(
    guess===
    PUZZLE.connection.answer
  ){

    completeConnection();

  }else{

    wrongSound();

    input.classList.add(
      "shake"
    );

    document.getElementById(
      "connectionHint"
    ).textContent=
      "That doesn't connect all four.";

    setTimeout(
      ()=>input.classList.remove(
        "shake"
      ),
      350
    );
  }
}


function revealConnection(){

  ensureAudio();

  const answer=
    PUZZLE.connection.answer;

  document.getElementById(
    "connectionInput"
  ).value=
    answer;

  document.getElementById(
    "connectionHint"
  ).textContent=
    "There it is.";

  setTimeout(
    completeConnection,
    550
  );
}


function completeConnection(){

  finishSound();

  const answer=
    PUZZLE.connection.answer;

  const input=
    document.getElementById(
      "connectionInput"
    );

  input.value=answer;
  input.disabled=true;

  document.getElementById(
    "connectBtn"
  ).disabled=true;

  document.getElementById(
    "connectionHintBtn"
  ).disabled=true;

  document.getElementById(
    "revealBtn"
  ).disabled=true;

  document.getElementById(
    "connectionLength"
  ).textContent=
    answer;

  /*
    Reveal the four relationships
    gently rather than replacing
    the whole screen at once.
  */

  const forms=
    solvedWords.map(
      word=>word+answer
    );

  let i=0;

  document.getElementById(
    "connectionHint"
  ).textContent="";

  function revealNext(){

    if(i>=forms.length){

      setTimeout(
        finish,
        700
      );

      return;
    }

    const existing=
      document.getElementById(
        "connectionHint"
      ).textContent;

    document.getElementById(
      "connectionHint"
    ).textContent=
      existing
        ? existing+"  ·  "+forms[i]
        : forms[i];

    tone(
      190+(i*28),
      .10,
      .016
    );

    i++;

    setTimeout(
      revealNext,
      360
    );
  }

  setTimeout(
    revealNext,
    350
  );
}


/* =========================================================
   FINISH
========================================================= */

function finish(){

  const visited=
    histories.filter(
      h=>h.size>0
    ).length;

  const connection=
    document.getElementById(
      "connection"
    );

  connection.style.opacity="0";

  connection.style.transition=
    "opacity .65s ease";

  setTimeout(()=>{

    connection.style.display=
      "none";

    document.getElementById(
      "finalPath"
    ).textContent=
      "YOUR PATH · "+
      visited+
      " OF 16 PLACES VISITED";

    document.getElementById(
      "final"
    ).classList.add("show");

  },650);
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  document.getElementById(
    "turnStat"
  ).textContent=
    turns+
    " TURN"+
    (turns===1?"":"S");

  document.getElementById(
    "attemptStat"
  ).textContent=
    attempts+
    " ATTEMPT"+
    (attempts===1?"":"S");

  document.getElementById(
    "hintStat"
  ).textContent=
    hints+
    " HINT"+
    (hints===1?"":"S");
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
  "unlockBtn"
).addEventListener(
  "click",
  unlock
);

document.getElementById(
  "resetBtn"
).addEventListener(
  "click",
  reset
);

document.getElementById(
  "hintBtn"
).addEventListener(
  "click",
  clueHint
);

document.getElementById(
  "connectBtn"
).addEventListener(
  "click",
  tryConnection
);

document.getElementById(
  "connectionHintBtn"
).addEventListener(
  "click",
  connectionHint
);

document.getElementById(
  "revealBtn"
).addEventListener(
  "click",
  revealConnection
);

document.getElementById(
  "connectionInput"
).addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      tryConnection();
    }
  }
);


/* =========================================================
   START
========================================================= */

renderClue();

</script>

</html>
