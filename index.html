<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>WORDLOCK #011</title>

<style>
:root{
  --cream:#f3eee4;
  --ink:#181818;
  --paper:#fffdf8;
  --steel:#303234;
  --solved:#b8c9c0;
  --solved-dark:#31594d;
  --gold:#d4a640;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--cream);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  display:flex;
  justify-content:center;
}

.game{
  width:min(100%,460px);
  padding:20px 15px 45px;
  text-align:center;
}

h1{
  margin:0 0 2px;
  font-size:35px;
  letter-spacing:5px;
  font-weight:950;
}

.subhead{
  color:#77736b;
  font-size:10px;
  font-weight:850;
  letter-spacing:2px;
  margin-bottom:12px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-bottom:12px;
}

.stat{
  color:#77736b;
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
}

.stat strong{
  display:block;
  color:var(--ink);
  font-size:18px;
}

.clue-card{
  background:rgba(255,255,255,.62);
  border:1px solid rgba(0,0,0,.07);
  border-radius:14px;
  padding:11px 15px 12px;
  margin-bottom:10px;
}

.clue-count{
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
  color:#8a857d;
  margin-bottom:3px;
}

.clue{
  font-size:21px;
  font-weight:850;
}

/* BANKED ANSWERS */

.answer-bank{
  min-height:38px;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:10px;
}

.banked-word{
  border:1px solid rgba(49,89,77,.25);
  background:rgba(184,201,192,.35);
  color:var(--solved-dark);
  border-radius:999px;
  padding:5px 9px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  animation:bankIn .45s ease-out;
}

@keyframes bankIn{
  from{
    transform:translateY(5px);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}

/* SAFE */

.safe-shell{
  position:relative;
  width:100%;
  perspective:1200px;
  margin-bottom:13px;
}

.safe-frame{
  position:relative;
  background:#202224;
  border-radius:20px;
  padding:9px;
  min-height:432px;
  box-shadow:
    0 8px 0 rgba(0,0,0,.13),
    0 13px 24px rgba(0,0,0,.08);
}

.vault-interior{
  position:absolute;
  inset:9px;
  border-radius:14px;
  background:
    radial-gradient(circle at 50% 40%,#303335,#151617 72%);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:32px 28px;
  color:white;
  z-index:0;
}

.vault-content{
  opacity:0;
  transform:scale(.96);
  transition:opacity .7s .7s,transform .7s .7s;
  position:relative;
  z-index:2;
}

.safe-frame.opened .vault-content{
  opacity:1;
  transform:scale(1);
}

.vault-heading{
  color:var(--gold);
  font-size:11px;
  font-weight:950;
  letter-spacing:2px;
  margin-bottom:14px;
}

.vault-fact{
  font-family:Georgia,serif;
  font-size:19px;
  line-height:1.43;
}

.final-result{
  margin-top:15px;
  color:#d0d0d0;
  font-size:11px;
  font-weight:800;
}

/* DOOR */

.door-wrap{
  position:relative;
  z-index:5;
  transform-style:preserve-3d;
  transform-origin:left center;
  transition:transform 1.4s cubic-bezier(.18,.72,.16,1);
}

.safe-door{
  position:relative;
  min-height:414px;
  background:linear-gradient(145deg,#3c3f41,#2e3032);
  border-radius:14px;
  border:2px solid #4c4f51;
  padding:18px 15px 16px;
  overflow:hidden;
  backface-visibility:hidden;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    inset -6px 0 10px rgba(0,0,0,.2);
}

.door-edge{
  position:absolute;
  top:7px;
  bottom:7px;
  right:-19px;
  width:28px;
  background:linear-gradient(90deg,#141516,#55585a,#252729);
  border-radius:0 8px 8px 0;
  transform:rotateY(90deg) translateZ(14px);
  transform-origin:left center;
}

.safe-frame.opened .door-wrap{
  transform:translateX(-3px) rotateY(-112deg);
}

.safe-label{
  color:#aaa;
  font-size:9px;
  letter-spacing:2.3px;
  font-weight:850;
  margin-bottom:12px;
}

.hinge{
  position:absolute;
  left:-10px;
  width:16px;
  height:48px;
  border-radius:5px;
  background:linear-gradient(90deg,#777,#b6b6b3,#656565);
  z-index:7;
}

.hinge.one{top:78px;}
.hinge.two{bottom:78px;}

/* LOCKS */

.lock-row{
  position:relative;
  height:70px;
  margin:3px 0;
  display:flex;
  align-items:center;
}

.lock-bed{
  position:absolute;
  left:3px;
  right:34px;
  top:6px;
  bottom:6px;
  border-radius:9px;
  background:#1f2021;
  border:1px solid rgba(255,255,255,.07);
}

.lock-number{
  position:absolute;
  left:8px;
  z-index:5;
  color:#858585;
  font-size:8px;
  font-weight:900;
}

.reels{
  position:relative;
  z-index:4;
  width:calc(100% - 75px);
  margin-left:28px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
}

.safe-bolt{
  position:absolute;
  right:3px;
  top:23px;
  width:38px;
  height:24px;
  background:#b9b8b3;
  border-radius:4px 12px 12px 4px;
  transition:transform .6s cubic-bezier(.2,.8,.25,1.2),background .35s;
  z-index:2;
}

.safe-bolt:after{
  content:"";
  position:absolute;
  right:6px;
  top:7px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#6e6e6a;
}

.lock-row.released .safe-bolt{
  transform:translateX(-29px);
  background:var(--solved);
}

/* REELS */

.reel{
  position:relative;
  height:59px;
  overflow:hidden;
  background:var(--paper);
  border-left:1px solid rgba(0,0,0,.15);
  border-right:1px solid rgba(0,0,0,.15);
  touch-action:none;
  user-select:none;
  transition:
    background .35s,
    color .35s,
    transform .14s,
    box-shadow .25s;
}

.reel:first-child{border-radius:5px 1px 1px 5px;}
.reel:last-child{border-radius:1px 5px 5px 1px;}

.choice-strip{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:1fr 1.42fr 1fr;
  align-items:center;
  pointer-events:none;
}

.choice{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  font-weight:900;
}

.choice.left,
.choice.right{
  font-size:13px;
  opacity:.5;
}

.choice.current{
  font-size:27px;
}

/* ENTIRE SOLVED POSITION */

.reel.solved{
  background:var(--solved);
  color:var(--solved-dark);
}

.reel.solved .left,
.reel.solved .right{
  opacity:0;
}

.reel.solved .current{
  font-size:28px;
}

/* TRACE */

.reel.trace{
  background:#111 !important;
  color:white !important;
  transform:scale(1.055);
  z-index:10;
}

/* START LETTER */

.reel.start-pulse .choice.current{
  animation:startLetter .72s ease-in-out 2;
}

@keyframes startLetter{
  0%,100%{
    transform:scale(1);
    color:#181818;
  }
  50%{
    transform:scale(1.55);
    color:#a26d00;
  }
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:80px 80px 1fr;
  gap:7px;
}

.controls button{
  border-radius:999px;
  font-weight:900;
}

.reset,
.hint{
  border:1.5px solid var(--ink);
  background:transparent;
  color:var(--ink);
  font-size:10px;
}

.unlock{
  border:0;
  padding:15px 12px;
  background:var(--ink);
  color:white;
  font-size:14px;
  letter-spacing:1.4px;
}

button:disabled{
  opacity:.45;
}

.message{
  min-height:35px;
  padding-top:9px;
  font-size:13px;
  font-weight:750;
}

/* KEY STAGE */

.key-stage{
  display:none;
  margin-top:17px;
  padding:18px 14px;
  border-radius:16px;
  background:rgba(255,255,255,.6);
}

.key-stage.show{
  display:block;
  animation:keyReveal .7s ease-out;
}

@keyframes keyReveal{
  from{
    transform:translateY(8px);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}

.key-heading{
  color:#7b5c12;
  font-size:11px;
  font-weight:950;
  letter-spacing:2px;
}

.key-question{
  font-family:Georgia,serif;
  font-size:22px;
  font-weight:bold;
  margin:8px 0 5px;
}

.key-copy{
  color:#6f6b64;
  font-size:12px;
  margin-bottom:13px;
}

.final-words{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin:12px auto 15px;
  max-width:260px;
}

.final-word{
  background:var(--solved);
  color:var(--solved-dark);
  border-radius:7px;
  padding:8px 5px;
  font-size:13px;
  font-weight:950;
  letter-spacing:1px;
}

.key-input{
  width:190px;
  padding:11px;
  border:2px solid var(--ink);
  border-radius:10px;
  text-align:center;
  text-transform:uppercase;
  font-size:20px;
  font-weight:950;
  letter-spacing:5px;
}

.key-button{
  display:block;
  margin:9px auto 0;
  border:0;
  border-radius:999px;
  padding:12px 25px;
  background:var(--ink);
  color:white;
  font-weight:950;
}

/* KEY RESOLUTION */

.connection-stage{
  display:none;
  margin-top:14px;
}

.connection-stage.show{
  display:block;
}

.connection{
  margin:5px auto;
  font-size:15px;
  font-weight:950;
  opacity:0;
  transform:translateY(3px);
}

.connection.reveal{
  animation:connectionIn .4s forwards;
}

.connection .key{
  color:#9a710c;
}

@keyframes connectionIn{
  to{
    opacity:1;
    transform:none;
  }
}

.master-area{
  margin:12px auto 1px;
  width:76px;
  height:76px;
}

.master-wheel{
  width:66px;
  height:66px;
  margin:auto;
  border-radius:50%;
  border:7px solid #999b9c;
  background:#252729;
  position:relative;
  transition:transform 1.05s,border-color .5s;
}

.master-wheel:before,
.master-wheel:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  background:#999b9c;
  transform:translate(-50%,-50%);
}

.master-wheel:before{
  width:48px;
  height:5px;
}

.master-wheel:after{
  width:5px;
  height:48px;
}

.master-wheel.ready{
  border-color:var(--gold);
}

.master-wheel.ready:before,
.master-wheel.ready:after{
  background:var(--gold);
}

.master-wheel.turn{
  transform:rotate(145deg);
}

</style>
</head>

<main class="game">

<script>

/*
======================================================
WORDLOCK #011
======================================================

QUESTION BEING TESTED:

Does the game become more coherent if:

1. whole solved words remain on the board;
2. solved positions become physically locked;
3. later answers may cross those positions;
4. the four answers themselves matter;
5. one semantic KEY connects all four?

No arbitrary gold-letter extraction.
======================================================
*/


/*
======================================================
PUZZLE CONSTRUCTION
======================================================

SABER
0 → 1 → 2 → 3 → 6

HOUSE
4 → 5 → 10 → 7 → 3

FLASH
8 → 12 → 13 → 9 → 4

SPOT
7 → 11 → 14 → 15


OVERLAPS:

HOUSE / SABER share E at 3.
FLASH / HOUSE share H at 4.
SPOT / HOUSE share S at 7.

Union = all 16 positions.

Final semantic KEY = LIGHT.
======================================================
*/


const wheels=[

["M","S","C"],  // 0
["A","N","I"],  // 1
["D","B","P"],  // 2
["E","R","Y"],  // 3

["H","M","D"],  // 4
["O","I","A"],  // 5
["R","L","U"],  // 6
["S","N","K"],  // 7

["C","F","M"],  // 8
["S","E","N"],  // 9
["U","A","I"],  //10
["P","D","Y"],  //11

["L","R","N"],  //12
["A","O","E"],  //13
["O","I","A"],  //14
["T","E","N"]   //15

];


const initialBoard=[
"M","N","D","R",
"M","I","L","N",
"C","E","A","D",
"R","O","I","E"
];


const puzzles=[

{
  clue:"A curved sword",
  answer:"SABER",
  path:[0,1,2,3,6],
  start:0
},

{
  clue:"A place to live",
  answer:"HOUSE",
  path:[4,5,10,7,3],
  start:4
},

{
  clue:"A sudden burst of light",
  answer:"FLASH",
  path:[8,12,13,9,4],
  start:8
},

{
  clue:"A small round mark",
  answer:"SPOT",
  path:[7,11,14,15],
  start:7
}

];


const KEY="LIGHT";


/*
======================================================
STATE
======================================================
*/

let letters=[...initialBoard];

let solved=Array(16).fill(false);

let clueSnapshot=[...letters];

let puzzleIndex=0;

let turns=0;
let attempts=0;
let hints=0;

let busy=false;
let interacted=false;

let pulseTimer=null;

let banked=[];


/*
======================================================
DOM
======================================================
*/

const $=id=>document.getElementById(id);

const lockStack=$("lockStack");

const clueEl=$("clue");
const clueCount=$("clueCount");

const turnCount=$("turnCount");
const attemptCount=$("attemptCount");
const hintCount=$("hintCount");

const answerBank=$("answerBank");

const message=$("message");

const resetBtn=$("resetBtn");
const hintBtn=$("hintBtn");
const unlockBtn=$("unlockBtn");

const controls=$("controls");

const keyStage=$("keyStage");
const finalWords=$("finalWords");

const keyInput=$("keyInput");
const keyButton=$("keyButton");

const connectionStage=$("connectionStage");

const masterWheel=$("masterWheel");
const safeFrame=$("safeFrame");

const finalResult=$("finalResult");

const wait=ms=>
  new Promise(resolve=>setTimeout(resolve,ms));


function updateStats(){

  turnCount.textContent=turns;
  attemptCount.textContent=attempts;
  hintCount.textContent=hints;

}


/*
======================================================
AUDIO
======================================================

Same technically successful Web Audio route as #010.

Still intentionally prototype-ish.
We're testing GAME STRUCTURE in #011,
not final sound design.
======================================================
*/

let audio=null;


async function getAudio(){

  try{

    if(!audio){

      audio=new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    }

    if(audio.state==="suspended"){
      await audio.resume();
    }

    return audio;

  }catch(error){

    return null;

  }

}


async function clickSound(
  volume=.11,
  pitch=520
){

  const ctx=await getAudio();

  if(!ctx) return;

  const now=ctx.currentTime;

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.type="triangle";

  osc.frequency.setValueAtTime(
    pitch,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    pitch*.58,
    now+.025
  );

  gain.gain.setValueAtTime(
    volume,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now+.035
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now+.04);

}


async function clunk(big=false){

  const ctx=await getAudio();

  if(!ctx) return;

  const now=ctx.currentTime;

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    big ? 78 : 105,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    big ? 34 : 50,
    now+(big?.25:.16)
  );

  gain.gain.setValueAtTime(
    big ? .28 : .18,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now+(big?.3:.2)
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now+(big?.31:.21));

}


async function wrongSound(){

  const ctx=await getAudio();

  if(!ctx) return;

  const now=ctx.currentTime;

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.type="sine";
  osc.frequency.value=82;

  gain.gain.setValueAtTime(.08,now);

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now+.12
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now+.13);

}


/*
======================================================
BUILD LOCKS
======================================================
*/

function buildLocks(){

  lockStack.innerHTML="";

  for(let row=0;row<4;row++){

    const lock=
      document.createElement("div");

    lock.className="lock-row";
    lock.id=`lockRow${row}`;

    lock.innerHTML=`

      <div class="lock-bed"></div>

      <div class="lock-number">
        ${row+1}
      </div>

      <div
        class="reels"
        id="row${row}">
      </div>

      <div class="safe-bolt"></div>

    `;

    lockStack.appendChild(lock);

  }


  for(let p=0;p<16;p++){

    const reel=
      document.createElement("div");

    reel.className="reel";
    reel.dataset.position=p;

    document
      .getElementById(
        `row${Math.floor(p/4)}`
      )
      .appendChild(reel);

    addSwipe(reel,p);

  }


  renderAll();

}


/*
======================================================
RENDER
======================================================
*/

function wheelIndex(p){

  return wheels[p].indexOf(
    letters[p]
  );

}


function optionAt(p,offset){

  const wheel=wheels[p];

  const index=
    (
      wheelIndex(p)+
      offset+
      wheel.length
    )%wheel.length;

  return wheel[index];

}


function getReel(p){

  return document.querySelector(
    `.reel[data-position="${p}"]`
  );

}


function render(p){

  const reel=getReel(p);

  if(!reel) return;

  const left=optionAt(p,-1);
  const current=letters[p];
  const right=optionAt(p,1);

  reel.className="reel";

  if(solved[p]){
    reel.classList.add("solved");
  }

  reel.innerHTML=`

    <div class="choice-strip">

      <div class="choice left">
        ${left}
      </div>

      <div class="choice current">
        ${current}
      </div>

      <div class="choice right">
        ${right}
      </div>

    </div>

  `;

}


function renderAll(){

  for(let p=0;p<16;p++){
    render(p);
  }

}


/*
======================================================
MOVEMENT
======================================================
*/

async function moveOne(
  p,
  direction,
  countTurn=true
){

  /*
  SOLVED = PHYSICALLY LOCKED.
  */

  if(
    busy ||
    solved[p]
  ){
    return;
  }

  await getAudio();

  const wheel=wheels[p];

  let index=wheelIndex(p);

  index=
    (
      index+
      direction+
      wheel.length
    )%wheel.length;

  letters[p]=wheel[index];

  if(countTurn){

    turns++;
    interacted=true;

    updateStats();
    stopEasyPulse();

  }

  clickSound();

  const reel=getReel(p);

  reel.style.transform=
    `translateX(${direction>0?-7:7}px)`;

  await wait(75);

  reel.style.transform="";

  render(p);

}


/*
======================================================
SWIPE
======================================================
*/

function addSwipe(reel,p){

  let startX=null;

  reel.addEventListener(
    "touchstart",
    async event=>{

      await getAudio();

      if(
        busy ||
        solved[p]
      ){
        return;
      }

      startX=
        event.touches[0].clientX;

    },
    {passive:true}
  );


  reel.addEventListener(
    "touchmove",
    event=>{

      if(startX===null) return;

      const dx=
        event.touches[0].clientX-
        startX;

      reel.style.transform=
        `translateX(${
          Math.max(
            -8,
            Math.min(8,dx*.13)
          )
        }px)`;

    },
    {passive:true}
  );


  reel.addEventListener(
    "touchend",
    event=>{

      if(startX===null) return;

      const dx=
        event.changedTouches[0].clientX-
        startX;

      reel.style.transform="";

      if(Math.abs(dx)>=18){

        moveOne(
          p,
          dx<0 ? 1 : -1,
          true
        );

      }

      startX=null;

    },
    {passive:true}
  );

}


/*
======================================================
SPATIAL SEARCH
======================================================
*/

function neighbours(p){

  const row=Math.floor(p/4);
  const col=p%4;

  const result=[];

  for(let dr=-1;dr<=1;dr++){

    for(let dc=-1;dc<=1;dc++){

      if(
        dr===0 &&
        dc===0
      ){
        continue;
      }

      const nr=row+dr;
      const nc=col+dc;

      if(
        nr>=0 &&
        nr<4 &&
        nc>=0 &&
        nc<4
      ){

        result.push(
          nr*4+nc
        );

      }

    }

  }

  return result;

}


function findPath(word){

  word=word.toUpperCase();

  function search(
    p,
    index,
    used,
    path
  ){

    if(
      letters[p]!==word[index]
    ){
      return null;
    }

    const nextPath=[
      ...path,
      p
    ];

    if(
      index===word.length-1
    ){
      return nextPath;
    }

    const nextUsed=
      new Set(used);

    nextUsed.add(p);

    for(
      const next
      of neighbours(p)
    ){

      if(nextUsed.has(next))
        continue;

      if(
        letters[next] !==
        word[index+1]
      ){
        continue;
      }

      const result=
        search(
          next,
          index+1,
          nextUsed,
          nextPath
        );

      if(result)
        return result;

    }

    return null;

  }


  for(let p=0;p<16;p++){

    if(
      letters[p]===word[0]
    ){

      const result=
        search(
          p,
          0,
          new Set(),
          []
        );

      if(result)
        return result;

    }

  }

  return null;

}


/*
======================================================
ROLLBACK
======================================================
*/

function directionTo(p,target){

  const wheel=wheels[p];

  const current=
    wheel.indexOf(letters[p]);

  const wanted=
    wheel.indexOf(target);

  if(
    (current+1)%3===wanted
  ){
    return 1;
  }

  return -1;

}


async function returnTo(
  p,
  target
){

  let safety=0;

  while(
    letters[p]!==target &&
    safety<4
  ){

    const direction=
      directionTo(p,target);

    const wheel=wheels[p];

    let index=
      wheel.indexOf(
        letters[p]
      );

    index=
      (
        index+
        direction+
        3
      )%3;

    letters[p]=wheel[index];

    clickSound(.07,420);

    const reel=getReel(p);

    reel.style.transform=
      `translateX(${
        direction>0?-6:6
      }px)`;

    await wait(85);

    reel.style.transform="";

    render(p);

    await wait(45);

    safety++;

  }

}


async function rollbackAll(){

  for(let p=0;p<16;p++){

    if(
      !solved[p] &&
      letters[p]!==clueSnapshot[p]
    ){

      await returnTo(
        p,
        clueSnapshot[p]
      );

    }

  }

}


async function rollbackIrrelevant(path){

  const keep=
    new Set(path);

  for(let p=0;p<16;p++){

    if(
      !keep.has(p) &&
      !solved[p] &&
      letters[p]!==clueSnapshot[p]
    ){

      await returnTo(
        p,
        clueSnapshot[p]
      );

    }

  }

}


/*
======================================================
RESET
======================================================
*/

resetBtn.addEventListener(
  "click",
  async()=>{

    if(busy) return;

    await getAudio();

    busy=true;
    disableControls(true);

    message.textContent=
      "Resetting…";

    await rollbackAll();

    message.textContent=
      "Ready.";

    busy=false;
    disableControls(false);

  }
);


/*
======================================================
EASY START PULSE
======================================================
*/

function stopEasyPulse(){

  if(pulseTimer){

    clearTimeout(pulseTimer);
    pulseTimer=null;

  }

  document
    .querySelectorAll(
      ".start-pulse"
    )
    .forEach(
      el=>el.classList.remove(
        "start-pulse"
      )
    );

}


function pulseStart(){

  if(
    busy ||
    interacted ||
    puzzleIndex>=4
  ){
    return;
  }

  const p=
    puzzles[puzzleIndex].start;

  const reel=getReel(p);

  /*
  If start position is already solved because
  this word crosses a previous route, don't
  pretend it is movable. It can still pulse.
  */

  reel.classList.remove(
    "start-pulse"
  );

  void reel.offsetWidth;

  reel.classList.add(
    "start-pulse"
  );

  setTimeout(
    ()=>{
      reel.classList.remove(
        "start-pulse"
      );
    },
    1500
  );

  pulseTimer=
    setTimeout(
      pulseStart,
      3500
    );

}


function startEasyPulse(){

  stopEasyPulse();

  pulseTimer=
    setTimeout(
      pulseStart,
      350
    );

}


/*
======================================================
HINT
======================================================

For #011 keep this intentionally simple:

Each press identifies the next unresolved position
in the intended path.

We are NOT testing the hint system today.
======================================================
*/

hintBtn.addEventListener(
  "click",
  ()=>{

    if(
      busy ||
      puzzleIndex>=4
    ){
      return;
    }

    const puzzle=
      puzzles[puzzleIndex];

    let target=null;

    for(
      let i=0;
      i<puzzle.path.length;
      i++
    ){

      const p=puzzle.path[i];

      if(
        letters[p] !==
        puzzle.answer[i]
      ){

        target=p;
        break;

      }

    }

    if(target===null){

      message.textContent=
        "You have what you need. Look again…";

      return;

    }

    hints++;
    updateStats();

    const reel=getReel(target);

    reel.animate(
      [
        {
          boxShadow:
            "0 0 0 0 rgba(212,166,64,0)"
        },
        {
          boxShadow:
            "0 0 0 4px rgba(212,166,64,.9)"
        },
        {
          boxShadow:
            "0 0 0 0 rgba(212,166,64,0)"
        }
      ],
      {
        duration:900,
        iterations:3
      }
    );

    message.textContent=
      "This reel is part of the path.";

  }
);


/*
======================================================
TRACE
======================================================
*/

async function trace(path){

  for(const p of path){

    const reel=getReel(p);

    reel.classList.add("trace");

    clickSound(.07,600);

    await wait(115);

  }

  await wait(250);

  for(const p of path){

    getReel(p)
      .classList
      .remove("trace");

    render(p);

  }

}


/*
======================================================
LOCK WHOLE SOLVED PATH
======================================================
*/

async function lockPath(
  path,
  answer
){

  /*
  This is the conceptual change.

  EVERY position used by the answer becomes
  part of the permanent solved network.

  Existing solved intersections simply stay solved.
  */

  for(const p of path){

    if(!solved[p]){

      solved[p]=true;

      render(p);

      const reel=getReel(p);

      reel.animate(
        [
          {transform:"scale(1)"},
          {transform:"scale(1.10)"},
          {transform:"scale(1)"}
        ],
        {
          duration:320
        }
      );

      await wait(90);

    }

  }

  banked.push(answer);

  renderBank();

}


function renderBank(){

  answerBank.innerHTML="";

  for(const word of banked){

    const item=
      document.createElement("div");

    item.className="banked-word";
    item.textContent=word;

    answerBank.appendChild(item);

  }

}


/*
======================================================
LOAD CLUE
======================================================
*/

function loadClue(){

  clueSnapshot=[...letters];

  interacted=false;

  renderAll();

  const puzzle=
    puzzles[puzzleIndex];

  clueCount.textContent=
    `LOCK ${puzzleIndex+1} OF 4`;

  clueEl.textContent=
    `${puzzle.clue} (${puzzle.answer.length})`;

  message.textContent=
    puzzleIndex===0
      ? "Find the word. Turn the reels."
      : "The solved letters stay locked.";

  startEasyPulse();

}


/*
======================================================
CONTROLS
======================================================
*/

function disableControls(value){

  resetBtn.disabled=value;
  hintBtn.disabled=value;
  unlockBtn.disabled=value;

}


/*
======================================================
UNLOCK
======================================================
*/

unlockBtn.addEventListener(
  "click",
  async()=>{

    if(busy) return;

    await getAudio();

    attempts++;
    updateStats();

    const puzzle=
      puzzles[puzzleIndex];

    const actualPath=
      findPath(
        puzzle.answer
      );


    /*
    WRONG
    */

    if(!actualPath){

      busy=true;
      disableControls(true);

      wrongSound();

      message.textContent=
        "Still locked.";

      await wait(450);

      await rollbackAll();

      await wait(120);

      message.textContent=
        "Try again.";

      interacted=false;

      busy=false;
      disableControls(false);

      startEasyPulse();

      return;

    }


    /*
    CORRECT
    */

    busy=true;

    disableControls(true);

    stopEasyPulse();

    message.textContent=
      `${puzzle.answer} ✓`;

    await trace(actualPath);

    await rollbackIrrelevant(
      actualPath
    );

    await lockPath(
      actualPath,
      puzzle.answer
    );

    document
      .getElementById(
        `lockRow${puzzleIndex}`
      )
      .classList
      .add("released");

    clunk(false);

    await wait(600);

    puzzleIndex++;


    if(puzzleIndex===4){

      await beginKeyStage();

      return;

    }


    loadClue();

    busy=false;

    disableControls(false);

  }
);


/*
======================================================
SEMANTIC KEY
======================================================
*/

async function beginKeyStage(){

  stopEasyPulse();

  controls.style.display="none";

  message.textContent="";

  clueCount.textContent=
    "FOUR LOCKS OPEN";

  clueEl.textContent=
    "Now connect them.";

  await wait(700);

  /*
  Let the completed network sit there for
  a moment before introducing the meta.
  */

  masterWheel.classList.add(
    "ready"
  );

  await wait(650);

  finalWords.innerHTML="";

  for(const word of banked){

    const tile=
      document.createElement("div");

    tile.className="final-word";
    tile.textContent=word;

    finalWords.appendChild(tile);

  }

  keyStage.classList.add(
    "show"
  );

  busy=false;

}


/*
======================================================
TURN KEY
======================================================
*/

keyButton.addEventListener(
  "click",
  async()=>{

    if(busy) return;

    await getAudio();

    const guess=
      keyInput.value
        .trim()
        .toUpperCase();

    if(!guess) return;


    if(guess!==KEY){

      wrongSound();

      keyInput.select();

      return;

    }


    busy=true;

    keyInput.disabled=true;
    keyButton.disabled=true;

    keyButton.textContent=
      "KEY FOUND";

    connectionStage.classList.add(
      "show"
    );


    /*
    Reveal WHY the answer works.
    */

    const connections=
      document.querySelectorAll(
        ".connection"
      );

    for(const item of connections){

      item.classList.add(
        "reveal"
      );

      clickSound(.08,500);

      await wait(350);

    }


    await wait(500);

    masterWheel.classList.add(
      "turn"
    );

    clunk(true);

    await wait(900);

    clueCount.textContent=
      "VAULT UNLOCKED";

    clueEl.textContent=
      "Connected.";

    await wait(500);

    clunk(true);

    safeFrame.classList.add(
      "opened"
    );

    await wait(1300);

    keyStage.style.display=
      "none";

    finalResult.textContent=
      `${turns} Turns · `+
      `${attempts} Attempts · `+
      `${hints} ${
        hints===1
          ? "Hint"
          : "Hints"
      }`;

  }
);


keyInput.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){
      keyButton.click();
    }

  }
);


/*
======================================================
START
======================================================
*/

buildLocks();
updateStats();
loadClue();

</script>
