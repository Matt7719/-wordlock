<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>WORDLOCK #010</title>

<style>
:root{
  --cream:#f3eee4;
  --ink:#181818;
  --paper:#fffdf8;
  --gold:#d4a640;
  --steel:#303234;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--cream);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  display:flex;
  justify-content:center;
}

.game{
  width:min(100%,460px);
  padding:20px 15px 45px;
  text-align:center;
}

h1{
  margin:0 0 2px;
  font-size:35px;
  letter-spacing:5px;
  font-weight:950;
}

.subhead{
  color:#77736b;
  font-size:10px;
  font-weight:850;
  letter-spacing:2px;
  margin-bottom:10px;
}

/* SOUND DIAGNOSTIC */

.sound-test{
  border:1px solid #aaa59c;
  background:transparent;
  border-radius:999px;
  padding:7px 13px;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  color:#6e6a63;
  margin-bottom:10px;
}

.sound-test.heard{
  opacity:.42;
}

/* STATS */

.stats{
  display:flex;
  justify-content:center;
  gap:27px;
  margin-bottom:12px;
}

.stat{
  color:#77736b;
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
}

.stat strong{
  display:block;
  color:var(--ink);
  font-size:18px;
}

.clue-card{
  background:rgba(255,255,255,.62);
  border:1px solid rgba(0,0,0,.07);
  border-radius:14px;
  padding:11px 15px 12px;
  margin-bottom:13px;
}

.clue-count{
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
  color:#8a857d;
  margin-bottom:3px;
}

.clue{
  font-size:21px;
  font-weight:850;
}

/* SAFE */

.safe-shell{
  position:relative;
  width:100%;
  perspective:1200px;
  margin-bottom:13px;
}

.safe-frame{
  position:relative;
  background:#202224;
  border-radius:20px;
  padding:9px;
  min-height:432px;
  box-shadow:
    0 8px 0 rgba(0,0,0,.13),
    0 13px 24px rgba(0,0,0,.08);
}

.vault-interior{
  position:absolute;
  inset:9px;
  border-radius:14px;
  background:
    radial-gradient(circle at 50% 40%,#303335,#151617 72%);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:32px 28px;
  color:white;
  z-index:0;
}

.vault-content{
  opacity:0;
  transform:scale(.96);
  transition:opacity .7s .7s,transform .7s .7s;
  position:relative;
  z-index:2;
}

.safe-frame.opened .vault-content{
  opacity:1;
  transform:scale(1);
}

.vault-heading{
  color:var(--gold);
  font-size:11px;
  font-weight:950;
  letter-spacing:2px;
  margin-bottom:14px;
}

.vault-fact{
  font-family:Georgia,serif;
  font-size:19px;
  line-height:1.43;
}

.vault-source{
  margin-top:15px;
  font-size:10px;
  color:#aaa;
}

.final-result{
  margin-top:15px;
  color:#d0d0d0;
  font-size:11px;
  font-weight:800;
}

/* DOOR */

.door-wrap{
  position:relative;
  z-index:5;
  transform-style:preserve-3d;
  transform-origin:left center;
  transition:transform 1.4s cubic-bezier(.18,.72,.16,1);
}

.safe-door{
  position:relative;
  min-height:414px;
  background:linear-gradient(145deg,#3c3f41,#2e3032);
  border-radius:14px;
  border:2px solid #4c4f51;
  padding:18px 15px 16px;
  overflow:hidden;
  backface-visibility:hidden;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    inset -6px 0 10px rgba(0,0,0,.2);
}

.door-edge{
  position:absolute;
  top:7px;
  bottom:7px;
  right:-19px;
  width:28px;
  background:linear-gradient(90deg,#141516,#55585a,#252729);
  border-radius:0 8px 8px 0;
  transform:rotateY(90deg) translateZ(14px);
  transform-origin:left center;
  z-index:-1;
}

.safe-frame.opened .door-wrap{
  transform:translateX(-3px) rotateY(-112deg);
}

.safe-label{
  color:#aaa;
  font-size:9px;
  letter-spacing:2.3px;
  font-weight:850;
  margin-bottom:12px;
}

.hinge{
  position:absolute;
  left:-10px;
  width:16px;
  height:48px;
  border-radius:5px;
  background:linear-gradient(90deg,#777,#b6b6b3,#656565);
  z-index:7;
}

.hinge.one{top:78px;}
.hinge.two{bottom:78px;}

/* LOCK ROWS */

.lock-row{
  position:relative;
  height:70px;
  margin:3px 0;
  display:flex;
  align-items:center;
}

.lock-bed{
  position:absolute;
  left:3px;
  right:34px;
  top:6px;
  bottom:6px;
  border-radius:9px;
  background:#1f2021;
  border:1px solid rgba(255,255,255,.07);
}

.lock-number{
  position:absolute;
  left:8px;
  z-index:5;
  color:#858585;
  font-size:8px;
  font-weight:900;
}

.reels{
  position:relative;
  z-index:4;
  width:calc(100% - 75px);
  margin-left:28px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
}

.safe-bolt{
  position:absolute;
  right:3px;
  top:23px;
  width:38px;
  height:24px;
  background:#b9b8b3;
  border-radius:4px 12px 12px 4px;
  transition:transform .6s cubic-bezier(.2,.8,.25,1.2),background .35s;
  z-index:2;
}

.safe-bolt:after{
  content:"";
  position:absolute;
  right:6px;
  top:7px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#6e6e6a;
}

.lock-row.released .safe-bolt{
  transform:translateX(-29px);
  background:var(--gold);
}

/* REELS */

.reel{
  position:relative;
  height:59px;
  overflow:hidden;
  background:var(--paper);
  border-left:1px solid rgba(0,0,0,.15);
  border-right:1px solid rgba(0,0,0,.15);
  touch-action:none;
  user-select:none;
  transition:background .25s,transform .14s,box-shadow .25s;
}

.reel:first-child{border-radius:5px 1px 1px 5px;}
.reel:last-child{border-radius:1px 5px 5px 1px;}

.choice-strip{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:1fr 1.42fr 1fr;
  align-items:center;
  pointer-events:none;
}

.choice{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  font-weight:900;
  transition:color .2s,transform .2s,opacity .2s;
}

.choice.left,
.choice.right{
  font-size:13px;
  opacity:.5;
}

.choice.current{
  font-size:27px;
}

.reel.gold{
  background:var(--gold);
}

.reel.gold .left,
.reel.gold .right{
  opacity:0;
}

.reel.trace{
  background:#111!important;
  color:white;
  transform:scale(1.055);
  z-index:10;
}

/* EASY START LETTER */

.reel.start-pulse .choice.current{
  animation:startLetter .72s ease-in-out 2;
}

@keyframes startLetter{
  0%,100%{
    transform:scale(1);
    color:#181818;
  }
  50%{
    transform:scale(1.55);
    color:#a26d00;
  }
}

/* HINT LEVEL 1 = REEL ONLY */

.reel.hint-reel{
  z-index:12;
  animation:hintReel 1s ease-in-out 3;
}

@keyframes hintReel{
  0%,100%{
    box-shadow:0 0 0 0 rgba(212,166,64,0);
  }
  50%{
    box-shadow:
      0 0 0 3px rgba(212,166,64,.8),
      0 0 16px rgba(212,166,64,.5);
  }
}

/* HINT LEVEL 2 = ACTUAL LETTER */

.choice.hint-target{
  color:#a26d00;
  animation:hintLetter .75s ease-in-out 4;
}

@keyframes hintLetter{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.6);}
}

/* MASTER */

.master-area{
  margin:12px auto 1px;
  width:76px;
  height:76px;
}

.master-wheel{
  width:66px;
  height:66px;
  margin:auto;
  border-radius:50%;
  border:7px solid #999b9c;
  background:#252729;
  position:relative;
  transition:transform 1.05s,border-color .5s;
}

.master-wheel:before,
.master-wheel:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  background:#999b9c;
  transform:translate(-50%,-50%);
}

.master-wheel:before{width:48px;height:5px;}
.master-wheel:after{width:5px;height:48px;}

.master-wheel.ready{border-color:var(--gold);}
.master-wheel.ready:before,
.master-wheel.ready:after{background:var(--gold);}
.master-wheel.turn{transform:rotate(145deg);}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:80px 80px 1fr;
  gap:7px;
}

.controls button{
  border-radius:999px;
  font-weight:900;
}

.reset,
.hint{
  border:1.5px solid var(--ink);
  background:transparent;
  color:var(--ink);
  font-size:10px;
}

.unlock{
  border:0;
  padding:15px 12px;
  background:var(--ink);
  color:white;
  font-size:14px;
  letter-spacing:1.4px;
}

button:disabled{opacity:.45;}

.message{
  min-height:35px;
  padding-top:9px;
  font-size:13px;
  font-weight:750;
}

/* KEY */

.key-stage{
  display:none;
  margin-top:17px;
}

.key-stage.show{
  display:block;
}

.key-heading{
  font-size:11px;
  font-weight:950;
  letter-spacing:2px;
}

.key-copy{
  font-size:13px;
  color:#6f6b64;
  margin:5px auto 12px;
}

.key-letters{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-bottom:12px;
}

.key-letter{
  width:48px;
  height:52px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--gold);
  font-size:25px;
  font-weight:950;
}

.key-input{
  width:190px;
  padding:11px;
  border:2px solid var(--ink);
  border-radius:10px;
  text-align:center;
  text-transform:uppercase;
  font-size:20px;
  font-weight:950;
  letter-spacing:5px;
}

.key-button{
  display:block;
  margin:9px auto;
  border:0;
  border-radius:999px;
  padding:12px 25px;
  background:var(--ink);
  color:white;
  font-weight:950;
}

</style>
</head>

<body>

<main class="game">

<h1>WORDLOCK</h1>
<div class="subhead">PROTOTYPE #010 · EASY</div>

<button id="soundTest" class="sound-test">
  🔊 TEST SOUND
</button>

<div class="stats">

  <div class="stat">
    <strong id="turnCount">0</strong>
    TURNS
  </div>

  <div class="stat">
    <strong id="attemptCount">0</strong>
    ATTEMPTS
  </div>

  <div class="stat">
    <strong id="hintCount">0</strong>
    HINTS
  </div>

</div>

<div class="clue-card">
  <div id="clueCount" class="clue-count"></div>
  <div id="clue" class="clue"></div>
</div>

<div class="safe-shell">

<div class="safe-frame" id="safeFrame">

<div class="vault-interior">
  <div class="vault-content">

    <div class="vault-heading">TODAY'S VAULT</div>

    <div class="vault-fact">
      A group of flamingos is called a flamboyance.
    </div>

    <div class="vault-source">
      Today's little thing worth knowing
    </div>

    <div class="final-result" id="finalResult"></div>

  </div>
</div>

<div class="door-wrap">

<div class="door-edge"></div>
<div class="hinge one"></div>
<div class="hinge two"></div>

<div class="safe-label">
  FOUR LOCKS · ONE VAULT
</div>

<div id="lockStack"></div>

<div class="master-area">
  <div id="masterWheel" class="master-wheel"></div>
</div>

</div>
</div>
</div>
</div>

<div class="controls" id="controls">

<button class="reset" id="resetBtn">
RESET
</button>

<button class="hint" id="hintBtn">
HINT
</button>

<button class="unlock" id="unlockBtn">
UNLOCK
</button>

</div>

<div class="message" id="message">

</div>

</div>

Four gold letters. Unscramble them.
</div>

<div id="keyLetters" class="key-letters"></div>

<input
id="keyInput"
class="key-input"
maxlength="4"
autocomplete="off"
autocorrect="off"
spellcheck="false"
placeholder="••••">

<button id="keyButton" class="key-button">
TURN KEY
</button>

</section>

</main>

<script>

/*
====================================================
WORDLOCK #010
====================================================

CONTROLLED REFINEMENT OF #009

NEW:
- Fresh validated puzzle
- Variable lengths: 4 / 6 / 5 / 7
- Hints
- Hint counter
- Explicit sound diagnostic
- Easy pulse identifies CURRENT LETTER
- Turns + Attempts retained

UNCHANGED:
- Three visible letters
- Horizontal swipe
- Four separate lock mechanisms
- One 4x4 spatial field
- 8-direction adjacency
- Gold = permanent Key letter
- Safe / Vault visual language
====================================================
*/


/*
====================================================
PUZZLE DATA — SPOILERS
====================================================
*/


const wheels=[

["R","M","B"], //0
["H","F","B"], //1
["L","P","B"], //2
["X","D","B"], //3

["E","K","B"], //4
["C","V","A"], //5
["T","Y","B"], //6
["W","I","M"], //7

["O","D","B"], //8
["T","A","M"], //9
["E","U","M"], //10
["S","F","B"], //11

["N","P","B"], //12
["G","D","B"], //13
["L","V","B"], //14
["T","K","B"]  //15

];


const initialBoard=[
"R","H","L","X",
"E","C","T","W",
"O","T","E","S",
"N","G","L","T"
];


/*
VALIDATED SEQUENCE

1 GUST (4)
13 → 10 → 11 → 15
clean changes: 1

2 LITTLE (6)
2 → 7 → 6 → 9 → 14 → 10
clean changes: 2

3 OCEAN (5)
8 → 5 → 4 → 9 → 12
clean changes: 1

4 WEATHER (7)
7 → 10 → 9 → 6 → 1 → 4 → 0
clean changes: 1

Each answer checked NOT present at clue-start.

All intended routes checked for 8-direction adjacency
with no repeated position.

Gold positions:
13 G
2  L
8  O
7  W

Spatial reading does NOT spell GLOW.

Extraction order:
7, 13, 8, 2 = W G O L

Final Key:
GLOW
*/


const puzzles=[

{
 clue:"A sudden strong rush of wind",
 answer:"GUST",
 start:13,
 gold:13,
 path:[13,10,11,15]
},

{
 clue:"Small in size",
 answer:"LITTLE",
 start:2,
 gold:2,
 path:[2,7,6,9,14,10]
},

{
 clue:"A vast body of salt water",
 answer:"OCEAN",
 start:8,
 gold:8,
 path:[8,5,4,9,12]
},

{
 clue:"The conditions outside — rain, sun, wind and so on",
 answer:"WEATHER",
 start:7,
 gold:7,
 path:[7,10,9,6,1,4,0]
}

];


const KEY_POSITIONS=[7,13,8,2];
const KEY_ANSWER="GLOW";


/*
====================================================
STATE
====================================================
*/

let letters=[...initialBoard];
let gold=Array(16).fill(false);
let clueSnapshot=[...letters];

let puzzleIndex=0;

let turns=0;
let attempts=0;
let hints=0;

let busy=false;
let interacted=false;

let pulseTimer=null;

/*
Hint state:

Each unresolved reel gets two hint levels.

1 = reel
2 = letter
*/

let hintPosition=null;
let hintLevel=0;


/*
====================================================
DOM
====================================================
*/

const $=id=>document.getElementById(id);

const lockStack=$("lockStack");

const clueEl=$("clue");
const clueCount=$("clueCount");

const turnCount=$("turnCount");
const attemptCount=$("attemptCount");
const hintCount=$("hintCount");

const message=$("message");

const resetBtn=$("resetBtn");
const hintBtn=$("hintBtn");
const unlockBtn=$("unlockBtn");

const soundTest=$("soundTest");

const controls=$("controls");

const masterWheel=$("masterWheel");
const safeFrame=$("safeFrame");

const keyStage=$("keyStage");
const keyLetters=$("keyLetters");
const keyInput=$("keyInput");
const keyButton=$("keyButton");

const finalResult=$("finalResult");

const wait=ms=>
new Promise(resolve=>setTimeout(resolve,ms));


function updateStats(){

 turnCount.textContent=turns;
 attemptCount.textContent=attempts;
 hintCount.textContent=hints;

}


/*
====================================================
AUDIO
====================================================

The TEST SOUND button deliberately bypasses all game
logic.

If this produces no sound on Matt's iPhone, the issue
is not a missing call from the reel code.
====================================================
*/

let audio=null;


async function getAudio(){

 try{

  if(!audio){

   audio=new(
    window.AudioContext ||
    window.webkitAudioContext
   )();

  }

  if(audio.state==="suspended"){

   await audio.resume();

  }

  return audio;

 }catch(error){

  return null;

 }

}


/*
Very obvious diagnostic tone.
*/

async function diagnosticSound(){

 const ctx=await getAudio();

 if(!ctx) return;


 const now=ctx.currentTime;


 function tone(
  frequency,
  start,
  duration
 ){

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.type="sine";

  osc.frequency.value=frequency;

  gain.gain.setValueAtTime(
   .32,
   now+start
  );

  gain.gain.exponentialRampToValueAtTime(
   .001,
   now+start+duration
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now+start);
  osc.stop(now+start+duration);

 }


 tone(620,0,.18);
 tone(310,.22,.28);

}


soundTest.addEventListener(
 "click",
 async()=>{

  await diagnosticSound();

  soundTest.textContent=
   "🔊 TEST SOUND AGAIN";

  soundTest.classList.add("heard");

 }
);


/*
Mechanical reel click.
*/

async function clickSound(
 volume=.18,
 pitch=900
){

 const ctx=await getAudio();

 if(!ctx) return;


 const now=ctx.currentTime;

 const osc=ctx.createOscillator();
 const gain=ctx.createGain();

 osc.type="square";

 osc.frequency.setValueAtTime(
  pitch,
  now
 );

 osc.frequency.exponentialRampToValueAtTime(
  pitch*.45,
  now+.035
 );

 gain.gain.setValueAtTime(
  volume,
  now
 );

 gain.gain.exponentialRampToValueAtTime(
  .001,
  now+.045
 );

 osc.connect(gain);
 gain.connect(ctx.destination);

 osc.start(now);
 osc.stop(now+.05);

}


/*
Low mechanical clunk.
*/

async function clunk(big=false){

 const ctx=await getAudio();

 if(!ctx) return;


 const now=ctx.currentTime;

 const osc=ctx.createOscillator();
 const gain=ctx.createGain();

 osc.type="triangle";

 osc.frequency.setValueAtTime(
  big ? 90 : 120,
  now
 );

 osc.frequency.exponentialRampToValueAtTime(
  big ? 38 : 55,
  now+(big?.28:.18)
 );

 gain.gain.setValueAtTime(
  big ? .35 : .24,
  now
 );

 gain.gain.exponentialRampToValueAtTime(
  .001,
  now+(big?.34:.22)
 );

 osc.connect(gain);
 gain.connect(ctx.destination);

 osc.start(now);
 osc.stop(now+(big?.35:.23));

}


async function wrongSound(){

 const ctx=await getAudio();

 if(!ctx) return;


 const now=ctx.currentTime;

 const osc=ctx.createOscillator();
 const gain=ctx.createGain();

 osc.type="square";
 osc.frequency.value=75;

 gain.gain.setValueAtTime(.11,now);
 gain.gain.exponentialRampToValueAtTime(
  .001,
  now+.14
 );

 osc.connect(gain);
 gain.connect(ctx.destination);

 osc.start(now);
 osc.stop(now+.15);

}


/*
====================================================
BUILD SAFE
====================================================
*/

function buildLocks(){

 lockStack.innerHTML="";


 for(let row=0;row<4;row++){

  const lock=document.createElement("div");

  lock.className="lock-row";
  lock.id=`lockRow${row}`;

  lock.innerHTML=`

   <div class="lock-bed"></div>

   <div class="lock-number">
    ${row+1}
   </div>

   <div
    class="reels"
    id="row${row}">
   </div>

   <div class="safe-bolt"></div>

  `;

  lockStack.appendChild(lock);

 }


 for(let p=0;p<16;p++){

  const reel=document.createElement("div");

  reel.className="reel";
  reel.dataset.position=p;

  document
   .getElementById(
    `row${Math.floor(p/4)}`
   )
   .appendChild(reel);

  addSwipe(reel,p);

 }


 renderAll();

}


/*
====================================================
REEL DISPLAY
====================================================
*/

function wheelIndex(p){

 return wheels[p].indexOf(
  letters[p]
 );

}


function optionAt(p,offset){

 const wheel=wheels[p];

 const index=
  (
   wheelIndex(p)+
   offset+
   wheel.length
  )%wheel.length;

 return wheel[index];

}


function getReel(p){

 return document.querySelector(
  `.reel[data-position="${p}"]`
 );

}


function render(p){

 const reel=getReel(p);

 if(!reel) return;


 const left=optionAt(p,-1);
 const current=letters[p];
 const right=optionAt(p,1);


 let target=null;

 if(
  p===hintPosition &&
  hintLevel>=2
 ){

  const puzzle=puzzles[puzzleIndex];

  const pathIndex=
   puzzle.path.indexOf(p);

  if(pathIndex>=0){

   target=
    puzzle.answer[pathIndex];

  }

 }


 reel.className="reel";


 if(gold[p]){
  reel.classList.add("gold");
 }


 if(
  p===hintPosition &&
  hintLevel===1
 ){
  reel.classList.add("hint-reel");
 }


 reel.innerHTML=`

 <div class="choice-strip">

  <div class="choice left
   ${left===target?"hint-target":""}">
   ${left}
  </div>

  <div class="choice current
   ${current===target?"hint-target":""}">
   ${current}
  </div>

  <div class="choice right
   ${right===target?"hint-target":""}">
   ${right}
  </div>

 </div>

 `;

}


function renderAll(){

 for(let p=0;p<16;p++){
  render(p);
 }

}


/*
====================================================
MOVEMENT
====================================================
*/

async function moveOne(
 p,
 direction,
 countTurn=true
){

 if(
  busy ||
  gold[p]
 ){
  return;
 }


 await getAudio();


 const wheel=wheels[p];

 let index=wheelIndex(p);

 index=
  (
   index+
   direction+
   wheel.length
  )%wheel.length;


 letters[p]=wheel[index];


 if(countTurn){

  turns++;
  interacted=true;

  updateStats();

  stopEasyPulse();

 }


 clickSound(.18,950);


 const reel=getReel(p);

 reel.style.transform=
  `translateX(${direction>0?-7:7}px)`;


 await wait(80);


 reel.style.transform="";


 render(p);

}


/*
====================================================
SWIPE
====================================================
*/

function addSwipe(reel,p){

 let startX=null;


 reel.addEventListener(
  "touchstart",
  async event=>{

   await getAudio();

   if(
    busy ||
    gold[p]
   ){
    return;
   }

   startX=
    event.touches[0].clientX;

  },
  {passive:true}
 );


 reel.addEventListener(
  "touchmove",
  event=>{

   if(startX===null) return;

   const dx=
    event.touches[0].clientX-
    startX;

   reel.style.transform=
    `translateX(${
     Math.max(
      -8,
      Math.min(8,dx*.13)
     )
    }px)`;

  },
  {passive:true}
 );


 reel.addEventListener(
  "touchend",
  event=>{

   if(startX===null) return;


   const dx=
    event.changedTouches[0].clientX-
    startX;


   reel.style.transform="";


   if(Math.abs(dx)>=18){

    moveOne(
     p,
     dx<0 ? 1 : -1,
     true
    );

   }


   startX=null;

  },
  {passive:true}
 );

}


/*
====================================================
SPATIAL SEARCH
====================================================
*/

function neighbours(p){

 const row=Math.floor(p/4);
 const col=p%4;

 const result=[];


 for(let dr=-1;dr<=1;dr++){

  for(let dc=-1;dc<=1;dc++){

   if(dr===0&&dc===0)
    continue;


   const nr=row+dr;
   const nc=col+dc;


   if(
    nr>=0 &&
    nr<4 &&
    nc>=0 &&
    nc<4
   ){

    result.push(
     nr*4+nc
    );

   }

  }

 }


 return result;

}


function findPath(word){

 word=word.toUpperCase();


 function search(
  p,
  index,
  used,
  path
 ){

  if(
   letters[p]!==word[index]
  ){
   return null;
  }


  const nextPath=[
   ...path,
   p
  ];


  if(
   index===word.length-1
  ){
   return nextPath;
  }


  const nextUsed=
   new Set(used);

  nextUsed.add(p);


  for(
   const next
   of neighbours(p)
  ){

   if(nextUsed.has(next))
    continue;


   if(
    letters[next] !==
    word[index+1]
   ){
    continue;
   }


   const result=
    search(
     next,
     index+1,
     nextUsed,
     nextPath
    );


   if(result)
    return result;

  }


  return null;

 }


 for(let p=0;p<16;p++){

  if(
   letters[p]===word[0]
  ){

   const result=
    search(
     p,
     0,
     new Set(),
     []
    );

   if(result)
    return result;

  }

 }


 return null;

}


/*
====================================================
ROLLBACK
====================================================
*/

function directionTo(p,target){

 const wheel=wheels[p];

 const current=
  wheel.indexOf(letters[p]);

 const wanted=
  wheel.indexOf(target);


 if(
  (current+1)%3===wanted
 ){
  return 1;
 }


 return -1;

}


async function returnTo(
 p,
 target
){

 let safety=0;


 while(
  letters[p]!==target &&
  safety<4
 ){

  const direction=
   directionTo(p,target);

  const wheel=wheels[p];

  let index=
   wheel.indexOf(
    letters[p]
   );

  index=
   (
    index+
    direction+
    3
   )%3;


  letters[p]=wheel[index];


  clickSound(.12,700);


  const reel=getReel(p);

  reel.style.transform=
   `translateX(${
    direction>0?-6:6
   }px)`;


  await wait(90);


  reel.style.transform="";

  render(p);

  await wait(55);

  safety++;

 }

}


async function rollbackAll(){

 for(let p=0;p<16;p++){

  if(
   !gold[p] &&
   letters[p]!==clueSnapshot[p]
  ){

   await returnTo(
    p,
    clueSnapshot[p]
   );

  }

 }

}


async function rollbackIrrelevant(path){

 const keep=new Set(path);


 for(let p=0;p<16;p++){

  if(
   !keep.has(p) &&
   !gold[p] &&
   letters[p]!==clueSnapshot[p]
  ){

   await returnTo(
    p,
    clueSnapshot[p]
   );

  }

 }

}


/*
====================================================
RESET
====================================================
*/

resetBtn.addEventListener(
 "click",
 async()=>{

  if(busy) return;

  await getAudio();

  busy=true;

  disableControls(true);

  message.textContent=
   "Resetting…";

  await rollbackAll();

  message.textContent=
   "Ready.";

  busy=false;

  disableControls(false);

 }
);


/*
====================================================
EASY START-LETTER PULSE
====================================================
*/

function stopEasyPulse(){

 if(pulseTimer){

  clearTimeout(pulseTimer);
  pulseTimer=null;

 }


 document
  .querySelectorAll(
   ".start-pulse"
  )
  .forEach(
   el=>el.classList.remove(
    "start-pulse"
   )
  );

}


function pulseStart(){

 if(
  busy ||
  interacted ||
  puzzleIndex>=4
 ){
  return;
 }


 const p=
  puzzles[puzzleIndex].start;

 const reel=getReel(p);


 reel.classList.remove(
  "start-pulse"
 );

 void reel.offsetWidth;

 reel.classList.add(
  "start-pulse"
 );


 setTimeout(
  ()=>{
   reel.classList.remove(
    "start-pulse"
   );
  },
  1500
 );


 pulseTimer=
  setTimeout(
   pulseStart,
   3500
  );

}


function startEasyPulse(){

 stopEasyPulse();

 pulseTimer=
  setTimeout(
   pulseStart,
   350
  );

}


/*
====================================================
HINTS
====================================================
*/

function firstUnresolvedPathPosition(){

 const puzzle=
  puzzles[puzzleIndex];


 for(
  let i=0;
  i<puzzle.path.length;
  i++
 ){

  const p=
   puzzle.path[i];

  const required=
   puzzle.answer[i];


  if(
   letters[p]!==required
  ){

   return p;

  }

 }


 /*
 If the intended path is already fully set,
 don't fabricate a hint.
 */

 return null;

}


hintBtn.addEventListener(
 "click",
 async()=>{

  if(busy) return;


  const unresolved=
   firstUnresolvedPathPosition();


  if(unresolved===null){

   message.textContent=
    "You don't need a hint. Look again…";

   return;

  }


  /*
  If this is a new unresolved position:
  first reveal its reel.
  */

  if(
   hintPosition!==unresolved
  ){

   hintPosition=unresolved;
   hintLevel=1;

   hints++;
   updateStats();

   renderAll();

   message.textContent=
    "Hint: this reel matters.";

   return;

  }


  /*
  Second hint:
  identify the required letter.
  */

  if(hintLevel===1){

   hintLevel=2;

   hints++;
   updateStats();

   renderAll();

   message.textContent=
    "Hint: bring this letter into focus.";

   return;

  }


  /*
  If player asks again after the letter has
  already been revealed, don't charge them
  repeatedly for identical information.
  */

  message.textContent=
   "You've got what you need from this hint.";

 }
);


/*
====================================================
TRACE
====================================================
*/

async function trace(path){

 for(const p of path){

  const reel=getReel(p);

  reel.classList.add("trace");

  clickSound(.10,1100);

  await wait(120);

 }


 await wait(260);


 for(const p of path){

  getReel(p)
   .classList
   .remove("trace");

  render(p);

 }

}


/*
====================================================
GOLD
====================================================
*/

async function awardGold(p){

 gold[p]=true;

 hintPosition=null;
 hintLevel=0;

 render(p);

 const reel=getReel(p);


 reel.animate(
  [
   {transform:"scale(1)"},
   {transform:"scale(1.16)"},
   {transform:"scale(1)"}
  ],
  {
   duration:550
  }
 );


 clunk(false);

 await wait(570);

}


/*
====================================================
LOAD CLUE
====================================================
*/

function loadClue(){

 clueSnapshot=[...letters];

 interacted=false;

 hintPosition=null;
 hintLevel=0;

 renderAll();


 const puzzle=
  puzzles[puzzleIndex];


 clueCount.textContent=
  `LOCK ${puzzleIndex+1} OF 4`;


 clueEl.textContent=
  `${puzzle.clue} (${puzzle.answer.length})`;


 message.textContent=
  "Find the word. Turn the reels. Make the path.";


 startEasyPulse();

}


/*
====================================================
CONTROLS
====================================================
*/

function disableControls(value){

 resetBtn.disabled=value;
 hintBtn.disabled=value;
 unlockBtn.disabled=value;

}


/*
====================================================
UNLOCK
====================================================
*/

unlockBtn.addEventListener(
 "click",
 async()=>{

  if(busy) return;


  await getAudio();


  attempts++;

  updateStats();


  const puzzle=
   puzzles[puzzleIndex];


  const actualPath=
   findPath(
    puzzle.answer
   );


  /*
  WRONG
  */

  if(!actualPath){

   busy=true;

   disableControls(true);

   wrongSound();

   message.textContent=
    "Still locked.";


   await wait(500);


   await rollbackAll();


   await wait(160);


   message.textContent=
    "Try again.";


   interacted=false;

   hintPosition=null;
   hintLevel=0;

   renderAll();


   busy=false;

   disableControls(false);

   startEasyPulse();

   return;

  }


  /*
  CORRECT
  */

  busy=true;

  disableControls(true);

  stopEasyPulse();


  message.textContent=
   `${puzzle.answer} ✓`;


  await trace(actualPath);


  await rollbackIrrelevant(
   actualPath
  );


  await wait(150);


  await awardGold(
   puzzle.gold
  );


  document
   .getElementById(
    `lockRow${puzzleIndex}`
   )
   .classList
   .add("released");


  clunk(false);


  await wait(620);


  puzzleIndex++;


  if(puzzleIndex===4){

   await keySequence();

   return;

  }


  loadClue();


  busy=false;

  disableControls(false);

 }
);


/*
====================================================
KEY
====================================================
*/

async function keySequence(){

 controls.style.display="none";

 soundTest.style.display="none";

 message.textContent="";


 clueCount.textContent=
  "ALL FOUR BOLTS RELEASED";


 clueEl.textContent=
  "But the Vault is still locked.";


 await wait(1100);


 masterWheel.classList.add(
  "ready"
 );


 await wait(500);


 clueCount.textContent=
  "THE FINAL MECHANISM";


 clueEl.textContent=
  "Make the Key.";


 keyStage.classList.add(
  "show"
 );


 keyLetters.innerHTML="";


 /*
 ACTUAL gold letters are extracted from
 the live board. No separate fake meta array.
 */


 for(
  const p
  of KEY_POSITIONS
 ){

  const tile=
   document.createElement("div");

  tile.className="key-letter";

  tile.textContent=
   letters[p];

  keyLetters.appendChild(tile);

  clickSound(.14,1000);

  await wait(200);

 }


 busy=false;

}


/*
====================================================
TURN KEY
====================================================
*/

keyButton.addEventListener(
 "click",
 async()=>{

  if(busy) return;


  await getAudio();


  const guess=
   keyInput.value
    .trim()
    .toUpperCase();


  if(!guess) return;


  if(
   guess!==KEY_ANSWER
  ){

   wrongSound();

   keyInput.select();

   return;

  }


  busy=true;


  keyInput.disabled=true;
  keyButton.disabled=true;


  keyButton.textContent=
   "KEY ACCEPTED";


  await wait(450);


  masterWheel.classList.add(
   "turn"
  );


  clunk(true);


  await wait(900);


  clueCount.textContent=
   "VAULT UNLOCKED";


  clueEl.textContent=
   "Open.";


  await wait(600);


  clunk(true);


  safeFrame.classList.add(
   "opened"
  );


  await wait(1300);


  keyStage.style.display=
   "none";


  finalResult.textContent=
   `${turns} Turns · `+
   `${attempts} Attempts · `+
   `${hints} ${
    hints===1?"Hint":"Hints"
   }`;

 }
);


keyInput.addEventListener(
 "keydown",
 event=>{

  if(event.key==="Enter"){

   keyButton.click();

  }

 }
);


/*
====================================================
START
====================================================
*/

buildLocks();
updateStats();
loadClue();
