<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="theme-color" content="#e7ddc9">

<title>WORDLOCK — Prototype #022</title>

<style>

:root{
  --ink:#20211f;

  --alt:#777b76;
  --remembered:#252724;

  --cream:rgba(248,245,235,.91);

  --sage:#adc1b0;
  --blue:#a9c4cd;
  --ochre:#d0b57a;
  --mauve:#bba8bd;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#e7ddc9;
  color:var(--ink);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Avenir Next",
  "Segoe UI",
  sans-serif;
}

body{
  overflow-x:hidden;
}

button,input{
  font:inherit;
}


/* ======================================================
   THE PLACE
====================================================== */

#place{
  position:relative;
  min-height:100vh;
  overflow:hidden;

  background:

    radial-gradient(
      ellipse at 75% 19%,
      rgba(150,170,126,.22),
      transparent 40%
    ),

    radial-gradient(
      ellipse at 14% 72%,
      rgba(183,161,120,.18),
      transparent 44%
    ),

    linear-gradient(
      145deg,
      #ebe0ca 0%,
      #e2d6bc 52%,
      #d8c9aa 100%
    );
}

.terrain{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}


/* ======================================================
   CONTOURS
====================================================== */

.contours{
  position:absolute;

  width:155%;
  height:1250px;

  left:-28%;
  top:80px;

  opacity:.61;
}

.contours path{
  fill:none;

  stroke:#6e7066;
  stroke-width:1.15;

  vector-effect:non-scaling-stroke;
}

.contours .fine{
  stroke-width:.72;
  opacity:.52;
}

.contours .light{
  stroke:#f3ead5;
  stroke-width:1;
  opacity:.60;
}


/* ======================================================
   WATER
====================================================== */

.water{
  position:absolute;

  left:-15%;
  top:670px;

  width:70%;
  height:330px;

  transform:rotate(-8deg);

  border-radius:
  45% 55% 52% 48% /
  52% 45% 55% 48%;

  background:

    repeating-linear-gradient(
      3deg,
      transparent 0 18px,
      rgba(67,125,137,.13) 19px,
      transparent 20px 34px
    ),

    radial-gradient(
      ellipse at 58% 42%,
      rgba(76,145,158,.49),
      rgba(103,155,161,.30) 47%,
      rgba(115,151,151,.13) 68%,
      transparent 77%
    );

  border:
  1px solid rgba(69,111,116,.22);
}

.water::before,
.water::after{
  content:"";
  position:absolute;

  border:
  1px solid rgba(73,108,109,.21);

  border-radius:50%;
}

.water::before{
  inset:-18px -31px;
}

.water::after{
  inset:-39px -58px;
  opacity:.52;
}


.ripples{
  position:absolute;

  left:-6%;
  top:748px;

  width:55%;
  height:170px;

  opacity:.34;

  background:

    repeating-radial-gradient(
      ellipse at 30% 50%,
      transparent 0 21px,
      rgba(239,242,226,.53) 22px,
      transparent 23px 36px
    );

  transform:rotate(-8deg);
}


/* ======================================================
   VEGETATION
====================================================== */

.vegetation{
  position:absolute;

  right:-10%;
  top:330px;

  width:59%;
  height:540px;

  background:

    radial-gradient(
      ellipse at 70% 44%,
      rgba(96,129,84,.29),
      rgba(111,137,96,.13) 43%,
      transparent 73%
    );
}

.vegetation::before{
  content:"";

  position:absolute;
  inset:0;

  background-image:

    radial-gradient(
      circle,
      rgba(56,88,56,.36) 0 1.2px,
      transparent 1.6px
    ),

    radial-gradient(
      circle,
      rgba(76,102,66,.25) 0 1px,
      transparent 1.45px
    );

  background-size:
  18px 20px,
  29px 27px;

  background-position:
  0 0,
  9px 12px;

  mask-image:
  radial-gradient(
    ellipse at 67% 45%,
    black 0 36%,
    transparent 75%
  );

  -webkit-mask-image:
  radial-gradient(
    ellipse at 67% 45%,
    black 0 36%,
    transparent 75%
  );
}

.vegetation::after{
  content:"";

  position:absolute;

  right:10%;
  top:7%;

  width:56%;
  height:57%;

  opacity:.23;

  background:

    repeating-linear-gradient(
      78deg,
      transparent 0 18px,
      rgba(52,80,51,.46) 19px,
      transparent 20px 31px
    );

  mask-image:
  radial-gradient(
    ellipse,
    black 0 39%,
    transparent 73%
  );

  -webkit-mask-image:
  radial-gradient(
    ellipse,
    black 0 39%,
    transparent 73%
  );
}


/* ======================================================
   STONE
====================================================== */

.stone{
  position:absolute;

  right:-28px;
  top:830px;

  width:150px;
  height:190px;

  border-radius:
  53% 47% 58% 42% /
  44% 58% 42% 56%;

  background:

    repeating-linear-gradient(
      162deg,
      transparent 0 17px,
      rgba(83,76,65,.07) 18px,
      transparent 19px 31px
    ),

    linear-gradient(
      135deg,
      rgba(158,140,111,.25),
      rgba(115,106,90,.39)
    );
}

.stone-small{
  position:absolute;

  left:-38px;
  top:560px;

  width:128px;
  height:110px;

  border-radius:
  47% 53% 44% 56%;

  background:

    linear-gradient(
      145deg,
      rgba(158,142,115,.25),
      rgba(112,104,89,.34)
    );
}


/* ======================================================
   SUGGESTED PATH
====================================================== */

.path{
  position:absolute;

  width:82%;
  height:455px;

  left:37%;
  top:440px;

  border-left:
  2px solid rgba(245,235,210,.34);

  border-radius:50%;

  transform:rotate(22deg);
}

.path::after{
  content:"";

  position:absolute;
  inset:0 0 0 8px;

  border-left:
  1px solid rgba(245,235,210,.24);

  border-radius:50%;
}


/* ======================================================
   MAIN LAYOUT
====================================================== */

.wrap{
  position:relative;
  z-index:2;

  width:min(94vw,520px);

  margin:0 auto;

  padding:
  max(30px,env(safe-area-inset-top))
  0
  max(50px,env(safe-area-inset-bottom));
}


header{
  text-align:center;
  margin:23px 0 24px;
}

.brand{
  font-size:14px;
  font-weight:850;
  letter-spacing:.37em;
}

.prototype{
  margin-top:7px;

  font-size:8px;
  font-weight:800;
  letter-spacing:.28em;

  color:#60635c;
}

.where{
  margin-top:15px;

  font-family:Georgia,serif;

  font-size:11px;
  letter-spacing:.22em;

  text-transform:uppercase;
}

.terrain-note{
  margin-top:6px;

  font-family:Georgia,serif;

  font-size:15px;

  color:#5d5d54;
}


/* ======================================================
   CLUE
====================================================== */

.clue-area{
  min-height:111px;

  padding:10px 10px 8px;

  text-align:center;
}

.progress{
  display:flex;
  justify-content:center;

  gap:10px;

  margin-bottom:14px;
}

.progress-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  border:
  1px solid rgba(60,62,57,.63);

  background:
  rgba(249,246,236,.48);

  transition:
  background .65s ease,
  transform .5s ease;
}

.progress-dot.done{
  transform:scale(1.08);
}

.progress-dot.done:nth-child(1){
  background:var(--sage);
  border-color:transparent;
}

.progress-dot.done:nth-child(2){
  background:var(--blue);
  border-color:transparent;
}

.progress-dot.done:nth-child(3){
  background:var(--ochre);
  border-color:transparent;
}

.progress-dot.done:nth-child(4){
  background:var(--mauve);
  border-color:transparent;
}


.clue-label{
  font-size:9px;
  font-weight:800;

  letter-spacing:.26em;

  color:#60635d;
}

#clue{
  max-width:390px;

  min-height:29px;

  margin:7px auto 4px;

  font-family:Georgia,serif;

  font-size:20px;
  line-height:1.25;
}

#length{
  font-size:10px;

  letter-spacing:.22em;

  color:#656861;
}


/* ======================================================
   BOARD
====================================================== */

.board{
  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  gap:12px 8px;

  padding:
  10px 9px 6px;
}


.reel{
  position:relative;

  height:76px;

  overflow:hidden;

  border:
  1px solid rgba(61,64,58,.23);

  border-radius:17px;

  background:var(--cream);

  box-shadow:

  0 5px 13px
  rgba(52,49,42,.11),

  inset 0 1px 0
  rgba(255,255,255,.82);

  user-select:none;
  -webkit-user-select:none;

  touch-action:pan-y;

  transition:

  background .68s ease,

  box-shadow .42s ease,

  transform .40s
  cubic-bezier(.22,.75,.26,1);
}


.reel-strip{
  position:absolute;
  inset:0;

  display:grid;

  grid-template-columns:
  1fr 1.28fr 1fr;

  align-items:center;

  text-align:center;

  will-change:transform;
}


.letter{
  display:flex;

  align-items:center;
  justify-content:center;

  line-height:1;

  transition:

  font-size .27s ease,

  opacity .27s ease,

  color .27s ease,

  transform .27s ease;
}


/*
  #022 LETTER HISTORY

  Pale little letter:
  unused alternative.

  Dark bold little letter:
  this letter has previously appeared
  here in a successful answer.
*/

.letter.alt{
  font-size:17px;
  font-weight:500;

  color:var(--alt);

  opacity:.76;
}

.letter.alt.remembered{
  color:var(--remembered);

  font-weight:900;

  opacity:1;
}

.letter.current{
  font-size:31px;

  font-weight:860;

  color:var(--ink);

  opacity:1;
}


/* ======================================================
   REEL MOTION
====================================================== */

.reel.cycle-left .reel-strip{

  animation:

  reelLeft .34s

  cubic-bezier(
    .25,.70,.25,1
  );
}

.reel.cycle-right .reel-strip{

  animation:

  reelRight .34s

  cubic-bezier(
    .25,.70,.25,1
  );
}


@keyframes reelLeft{

  0%{
    transform:translateX(0);
  }

  66%{
    transform:translateX(-16%);
  }

  84%{
    transform:translateX(-12%);
  }

  100%{
    transform:translateX(0);
  }
}


@keyframes reelRight{

  0%{
    transform:translateX(0);
  }

  66%{
    transform:translateX(16%);
  }

  84%{
    transform:translateX(12%);
  }

  100%{
    transform:translateX(0);
  }
}


.reel.settle{

  animation:

  settle .27s ease;
}


@keyframes settle{

  0%{
    transform:scale(1);
  }

  55%{
    transform:scale(.985);
  }

  100%{
    transform:scale(1);
  }
}


.reel.confirming{

  transform:scale(1.045);

  box-shadow:

  0 0 0 3px
  rgba(255,255,255,.34),

  0 8px 17px
  rgba(50,47,40,.13);
}


/* ======================================================
   #022 — PERSISTENT STARTING PULSE

   Quietly repeats until the player makes
   their first reel movement for this clue.
====================================================== */

.reel.pulse{

  animation:

  startPulse 2.2s
  ease-in-out infinite;
}


@keyframes startPulse{

  0%,
  68%,
  100%{

    transform:scale(1);

    box-shadow:

    0 5px 13px
    rgba(52,49,42,.11),

    inset 0 1px 0
    rgba(255,255,255,.82);
  }


  82%{

    transform:
    scale(1.045);

    box-shadow:

    0 0 0 3px
    rgba(60,65,58,.10),

    0 7px 16px
    rgba(50,48,42,.13);
  }
}


/* ======================================================
   COLOUR HISTORY
====================================================== */

.reel.used1{
  background:
  rgba(173,193,176,.93);
}

.reel.used2{
  background:
  rgba(169,196,205,.93);
}

.reel.used3{
  background:
  rgba(208,181,122,.93);
}

.reel.used4{
  background:
  rgba(187,168,189,.93);
}


.reel.mix12{

  background:

  linear-gradient(
    135deg,
    var(--sage),
    var(--blue)
  );
}

.reel.mix13{

  background:

  linear-gradient(
    135deg,
    var(--sage),
    var(--ochre)
  );
}

.reel.mix14{

  background:

  linear-gradient(
    135deg,
    var(--sage),
    var(--mauve)
  );
}

.reel.mix23{

  background:

  linear-gradient(
    135deg,
    var(--blue),
    var(--ochre)
  );
}

.reel.mix24{

  background:

  linear-gradient(
    135deg,
    var(--blue),
    var(--mauve)
  );
}

.reel.mix34{

  background:

  linear-gradient(
    135deg,
    var(--ochre),
    var(--mauve)
  );
}


/* ======================================================
   CONTROLS
====================================================== */

.controls{
  display:grid;

  grid-template-columns:
  1fr 1.65fr 1fr;

  gap:9px;

  padding:0 9px;

  margin-top:16px;
}

.btn{
  min-height:49px;

  border:
  1px solid rgba(52,54,50,.40);

  border-radius:16px;

  background:
  rgba(247,243,232,.84);

  color:#343632;

  font-size:10px;
  font-weight:800;

  letter-spacing:.14em;
}

.btn.primary{

  background:#30322e;

  color:#f8f5eb;

  border-color:#30322e;
}

.btn:active{
  transform:translateY(1px);
}


#message{
  min-height:36px;

  padding-top:10px;

  text-align:center;

  font-family:Georgia,serif;

  font-style:italic;

  font-size:14px;

  color:#55584f;
}


/* ======================================================
   BANK
====================================================== */

.bank{
  min-height:38px;

  margin-top:5px;

  display:flex;

  justify-content:center;
  flex-wrap:wrap;

  gap:7px;
}


.pill{
  opacity:0;

  transform:
  translateY(5px)
  scale(.97);

  padding:
  7px 12px;

  border-radius:999px;

  font-size:11px;
  font-weight:800;

  letter-spacing:.08em;

  animation:

  pillIn .65s

  cubic-bezier(
    .22,.72,.26,1
  )

  forwards;
}


@keyframes pillIn{

  to{
    opacity:1;

    transform:
    translateY(0)
    scale(1);
  }
}


.pill.c1{
  background:var(--sage);
}

.pill.c2{
  background:var(--blue);
}

.pill.c3{
  background:var(--ochre);
}

.pill.c4{
  background:var(--mauve);
}


.stats{
  display:flex;
  justify-content:center;

  gap:22px;

  margin-top:8px;

  font-size:9px;
  font-weight:800;

  letter-spacing:.14em;

  color:#565951;
}


/* ======================================================
   CONNECTION
====================================================== */

.connection{
  display:none;

  margin:
  28px 10px 0;

  padding:
  25px 12px 22px;

  border-top:
  1px solid rgba(64,66,59,.25);

  text-align:center;
}


.connection.show{

  display:block;

  animation:
  gentleIn .9s ease both;
}


@keyframes gentleIn{

  from{
    opacity:0;
    transform:translateY(7px);
  }

  to{
    opacity:1;
    transform:none;
  }
}


.connection-title{

  font-size:9px;

  font-weight:800;

  letter-spacing:.27em;

  color:#5c5f58;
}


.connection-copy{

  margin:8px 0 12px;

  font-family:Georgia,serif;

  font-size:20px;
}


.connection-words{

  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:7px;
}


.connection-length{

  margin:
  15px 0 6px;

  font-size:20px;

  font-weight:800;

  letter-spacing:.32em;

  color:#55584f;
}


.connection-input{

  width:min(250px,82%);

  border:0;

  border-bottom:
  1px solid #696b63;

  border-radius:0;

  background:transparent;

  padding:8px;

  outline:none;

  text-align:center;

  text-transform:uppercase;

  font-size:23px;

  font-weight:800;

  letter-spacing:.14em;

  color:#252724;
}


.connection-actions{

  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:8px;

  margin-top:14px;
}


.connection-actions .btn{
  padding:0 17px;
}


#connectionHint{

  max-width:340px;

  min-height:46px;

  margin:13px auto 0;

  font-family:Georgia,serif;

  font-style:italic;

  font-size:14px;

  line-height:1.4;

  color:#55584f;
}


/* ======================================================
   FINISH
====================================================== */

.final{

  display:none;

  margin:
  28px 12px 0;

  padding:
  27px 10px;

  text-align:center;
}


.final.show{

  display:block;

  animation:
  gentleIn 1.3s ease both;
}


.final-kicker{

  font-size:9px;

  font-weight:800;

  letter-spacing:.27em;
}


.final-title{

  margin-top:8px;

  font-family:Georgia,serif;

  font-size:28px;
}


.final-copy{

  max-width:325px;

  margin:8px auto;

  font-family:Georgia,serif;

  font-size:15px;

  line-height:1.5;

  color:#50534c;
}


.final-path{

  margin-top:17px;

  font-size:10px;

  font-weight:800;

  letter-spacing:.15em;

  color:#50534c;
}


.shake{
  animation:
  shake .30s linear;
}


@keyframes shake{

  25%{
    transform:translateX(-4px);
  }

  50%{
    transform:translateX(4px);
  }

  75%{
    transform:translateX(-2px);
  }
}


@media(max-width:390px){

  .board{
    gap:10px 7px;
  }

  .reel{
    height:70px;
    border-radius:15px;
  }

  .letter.alt{
    font-size:16px;
  }

  .letter.current{
    font-size:29px;
  }

  #clue{
    font-size:19px;
  }
}


@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms!important;

    transition-duration:.01ms!important;
  }
}

</style>
</head>

class="connection-words"
id="connectionWords">
</div>


<div
class="connection-length"
id="connectionLength">
</div>


<input
id="connectionInput"
class="connection-input"
autocomplete="off"
autocapitalize="characters"
spellcheck="false"
maxlength="12"
aria-label="Connecting word">


<div class="connection-actions">


<button
class="btn primary"
id="connectBtn">
CONNECT
</button>


<button
class="btn"
id="connectionHintBtn">
HINT
</button>


<button
class="btn"
id="revealBtn">
REVEAL
</button>


</div>


<div id="connectionHint"></div>


</section>


<section
class="final"
id="final">


<div class="final-kicker">
A FIRST TRACE
</div>


<div class="final-title">
Your path remains.
</div>


<div class="final-copy">
This place is a little different because you passed through it.
</div>


<div
class="final-path"
id="finalPath">
</div>


</section>


</main>

</div>


<script>

/* ======================================================
   WORDLOCK
   PROTOTYPE #022
====================================================== */


const PUZZLE={


wheels:[

["C","M","P"],
["R","I","A"],
["D","N","F"],
["O","S","E"],

["H","G","B"],
["T","Y","L"],
["R","V","K"],
["O","J","U"],

["H","Q","F"],
["A","X","E"],
["L","U","S"],
["R","W","N"],

["R","D","F"],
["O","N","G"],
["L","X","A"],
["D","V","K"]

],


clues:[


{
answer:"PATH",

clue:
"A way through a place",

start:0,

colour:1,

target:[
0,1,5,4
]
},


{
answer:"DOOR",

clue:
"An entrance from one space to another",

start:2,

colour:2,

target:[
2,3,7,6
]
},


{
answer:"HALL",

clue:
"A passage or entrance space inside a building",

start:8,

colour:3,

target:[
8,9,10,14
]
},


{
answer:"ROAD",

clue:
"A route joining one place to another",

start:12,

colour:4,

target:[
12,13,14,15
]
}


],


connection:{

answer:"WAY",

hint1:
"The connecting word comes after all four answers.",

hint2:
"Think about movement, direction or passage.",

hint3:
"PATH, DOOR, HALL and ROAD can all be followed by the same three letters."

}


};


/* ======================================================
   STATE
====================================================== */


let clueIndex=0;


let current=
PUZZLE.wheels.map(
()=>1
);


let clueSnapshot=[
...current
];


let remembered=
PUZZLE.wheels.map(
()=>new Set()
);


let histories=
PUZZLE.wheels.map(
()=>new Set()
);


let solvedWords=[];


let turns=0;

let attempts=0;

let hints=0;


let connectionHintLevel=0;


let busy=false;


/*
  #022

  Each new clue starts with its starting reel
  gently pulsing.

  As soon as the player makes their first actual
  reel movement, this becomes true and the pulse
  is no longer restored by subsequent renders.
*/

let clueHasStarted=false;


/* ======================================================
   AUDIO — #022
====================================================== */


let audioCtx=null;


function getAudioContext(){

if(audioCtx){
return audioCtx;
}


const AC=
window.AudioContext ||
window.webkitAudioContext;


if(!AC){
return null;
}


audioCtx=
new AC();


return audioCtx;

}


/*
  Wake Safari's AudioContext directly from
  a genuine user gesture.
*/


function wakeAudio(){

const ctx=
getAudioContext();


if(!ctx){
return;
}


if(
ctx.state===
"suspended"
){

ctx.resume()
.catch(
()=>{}
);

}

}


/*
  Give Safari repeated opportunities to wake
  the context until it is actually running.
*/


document.addEventListener(
"touchstart",
wakeAudio,
{
capture:true,
passive:true
}
);


document.addEventListener(
"pointerdown",
wakeAudio,
true
);


document.addEventListener(
"click",
wakeAudio,
true
);


/*
  A tone waits until the context has resumed
  before scheduling itself.

  This is intended to prevent the first reel
  sound disappearing while Safari wakes.
*/


async function tone(
frequency,
duration,
volume,
type="sine",
delay=0
){

const ctx=
getAudioContext();


if(!ctx){
return;
}


if(
ctx.state===
"suspended"
){

try{

await ctx.resume();

}
catch(e){

return;

}

}


const now=
ctx.currentTime+
delay;


const osc=
ctx.createOscillator();


const gain=
ctx.createGain();


osc.type=
type;


osc.frequency
.setValueAtTime(
frequency,
now
);


gain.gain
.setValueAtTime(
.0001,
now
);


gain.gain
.exponentialRampToValueAtTime(
Math.max(
volume,
.0002
),
now+.012
);


gain.gain
.exponentialRampToValueAtTime(
.0001,
now+duration
);


osc.connect(
gain
);


gain.connect(
ctx.destination
);


osc.start(
now
);


osc.stop(
now+
duration+
.04
);

}


const REEL_PITCHES=[

174,185,196,207,

185,196,208,220,

165,174,185,196,

155,165,174,185

];


function reelSound(index){

const root=
REEL_PITCHES[index];


tone(
92,
.045,
.006,
"triangle"
);


tone(
root,
.22,
.010,
"sine",
.018
);


tone(
root*2.01,
.34,
.0033,
"sine",
.045
);

}


function wrongSound(){

tone(
104,
.13,
.013,
"triangle"
);


tone(
78,
.20,
.007,
"sine",
.025
);

}


function pathSound(step){

const notes=[

174,
196,
220,
247,
277,
294

];


const f=
notes[
Math.min(
step,
notes.length-1
)
];


tone(
f,
.28,
.0085,
"sine"
);


tone(
f*2,
.40,
.0028,
"sine",
.035
);

}


function connectionSound(){

const notes=[

174,
220,
261,
330

];


notes.forEach(
(n,i)=>{

tone(
n,
.42,
.008,
"sine",
i*.13
);


tone(
n*2,
.52,
.0024,
"sine",
i*.13+.035
);

}
);

}


/* ======================================================
   BOARD HELPERS
====================================================== */


function letterAt(i){

return(
PUZZLE.wheels[i]
[current[i]]
);

}


function adjacent(a,b){

const ar=
Math.floor(a/4);

const ac=
a%4;


const br=
Math.floor(b/4);

const bc=
b%4;


return(

Math.max(

Math.abs(ar-br),

Math.abs(ac-bc)

)===1

);

}


/*
  Exhaustively find every valid path
  spelling the answer in the current
  central letters.
*/


function findPaths(word){

const results=[];


function walk(
position,
index,
path
){

if(
index===
word.length
){

results.push(
[...path]
);

return;

}


for(
let i=0;
i<16;
i++
){

if(
path.includes(i)
){
continue;
}


if(
letterAt(i)!==
word[index]
){
continue;
}


if(
position!==null &&
!adjacent(
position,
i
)
){
continue;
}


path.push(i);


walk(
i,
index+1,
path
);


path.pop();

}

}


walk(
null,
0,
[]
);


return results;

}


/* ======================================================
   HISTORY COLOUR
====================================================== */


function applyHistory(
reel,
index
){

const colours=
[...histories[index]];


if(
colours.length===1
){

reel.classList.add(
"used"+
colours[0]
);

return;

}


if(
colours.length>=2
){

const a=
Math.min(
...colours
);


const b=
Math.max(
...colours
);


const mix=
"mix"+a+b;


if(
[
"mix12",
"mix13",
"mix14",
"mix23",
"mix24",
"mix34"
]
.includes(mix)
){

reel.classList.add(
mix
);

}

}

}


/* ======================================================
   STARTING PULSE
====================================================== */


function applyStartingPulse(){

if(
clueHasStarted ||
clueIndex>=
PUZZLE.clues.length
){
return;
}


const clue=
PUZZLE.clues[
clueIndex
];


const reels=
document
.querySelectorAll(
".reel"
);


reels[
clue.start
]
?.classList.add(
"pulse"
);

}


/* ======================================================
   RENDER BOARD
====================================================== */


function render(){

const board=
document.getElementById(
"board"
);


board.innerHTML="";


PUZZLE.wheels.forEach(
(wheel,i)=>{


const reel=
document.createElement(
"div"
);


reel.className=
"reel";


applyHistory(
reel,
i
);


const centre=
current[i];


const left=
(centre+2)%3;


const right=
(centre+1)%3;


const strip=
document.createElement(
"div"
);


strip.className=
"reel-strip";


[
{
idx:left,
type:"alt"
},

{
idx:centre,
type:"current"
},

{
idx:right,
type:"alt"
}

]
.forEach(
item=>{


const el=
document.createElement(
"div"
);


el.className=
"letter "+
item.type;


const letter=
wheel[item.idx];


if(
item.type==="alt" &&
remembered[i]
.has(letter)
){

el.classList.add(
"remembered"
);

}


el.textContent=
letter;


strip.appendChild(
el
);

}
);


reel.appendChild(
strip
);


let startX=null;


reel.addEventListener(
"pointerdown",
e=>{


if(busy){
return;
}


wakeAudio();


startX=
e.clientX;


reel
.setPointerCapture?.(
e.pointerId
);

}
);


reel.addEventListener(
"pointerup",
e=>{


if(
busy ||
startX===null
){
return;
}


const dx=
e.clientX-
startX;


startX=null;


if(
Math.abs(dx)<16
){
return;
}


animateTurn(
i,
dx<0 ? 1 : -1
);

}
);


board.appendChild(
reel
);

}
);


/*
  render() recreates the reel elements.

  If this clue has not yet been touched,
  restore the persistent starting pulse.
*/

applyStartingPulse();


updateStats();

}


/* ======================================================
   REEL TURN
====================================================== */


function animateTurn(
index,
direction
){

if(busy){
return;
}


/*
  First actual movement of this clue:
  the orientation aid has done its job.
*/

if(
!clueHasStarted
){

clueHasStarted=true;


document
.querySelectorAll(
".reel.pulse"
)
.forEach(
reel=>{

reel.classList.remove(
"pulse"
);

}
);

}


busy=true;


wakeAudio();


const reel=
document
.querySelectorAll(
".reel"
)[index];


reel.classList.add(

direction===1

? "cycle-left"

: "cycle-right"

);


reelSound(index);


/*
  The strip visibly begins to travel
  before the underlying state changes.
*/


setTimeout(
()=>{


current[index]=

(
current[index]+
direction+
3
)%3;


turns++;


render();


const fresh=
document
.querySelectorAll(
".reel"
)[index];


fresh?.classList.add(
"settle"
);


setTimeout(
()=>{


fresh?.classList.remove(
"settle"
);


busy=false;


},
270
);


},
220
);

}


/* ======================================================
   CLUE
====================================================== */


function renderClue(){

busy=false;


/*
  New clue = new orientation aid.
*/

clueHasStarted=false;


const clue=
PUZZLE.clues[
clueIndex
];


document
.getElementById(
"clueLabel"
)
.textContent=

"CLUE "+
(clueIndex+1);


document
.getElementById(
"clue"
)
.textContent=
clue.clue;


document
.getElementById(
"length"
)
.textContent=

clue.answer.length+
" LETTERS";


document
.getElementById(
"message"
)
.textContent="";


render();

}


/* ======================================================
   UNLOCK
====================================================== */


function unlock(){

if(busy){
return;
}


wakeAudio();


attempts++;


updateStats();


const clue=
PUZZLE.clues[
clueIndex
];


const paths=
findPaths(
clue.answer
);


if(
!paths.length
){

wrongSound();


busy=true;


const board=
document.getElementById(
"board"
);


board.classList.add(
"shake"
);


document
.getElementById(
"message"
)
.textContent=

"Not quite. The place settles back.";


setTimeout(
()=>{


board.classList.remove(
"shake"
);


current=[
...clueSnapshot
];


render();


busy=false;


},
720
);


return;

}


/*
  Same deliberate #020/#021 limitation:

  Any valid route is accepted.

  If several simultaneous routes exist,
  this prototype records the first route
  found by the search.
*/


solve(
clue,
paths[0]
);

}


/* ======================================================
   SUCCESS
====================================================== */


function solve(
clue,
path
){

busy=true;


document
.getElementById(
"message"
)
.textContent="";


path.forEach(
(position,n)=>{


remembered[position]
.add(
clue.answer[n]
);

}
);


let step=0;


function colourNext(){


if(
step>=
path.length
){

setTimeout(
()=>completeWord(
clue,
path
),
420
);


return;

}


const position=
path[step];


histories[position]
.add(
clue.colour
);


render();


const reel=
document
.querySelectorAll(
".reel"
)[position];


reel?.classList.add(
"confirming"
);


pathSound(step);


setTimeout(
()=>{


reel?.classList.remove(
"confirming"
);


},
320
);


step++;


setTimeout(
colourNext,
175
);

}


colourNext();

}


/* ======================================================
   COMPLETE WORD
====================================================== */


function completeWord(
clue,
path
){

solvedWords.push(
clue.answer
);


renderBank();


document
.querySelectorAll(
".progress-dot"
)[clueIndex]
.classList.add(
"done"
);


document
.getElementById(
"message"
)
.textContent=

clue.answer+
" found.";


/*
  Roll irrelevant experimentation back
  while retaining the successful
  configuration of the accepted path.
*/


const next=[
...clueSnapshot
];


path.forEach(
i=>{

next[i]=
current[i];

}
);


current=next;


clueSnapshot=[
...current
];


clueIndex++;


if(
clueIndex>=
PUZZLE.clues.length
){

setTimeout(
showConnection,
1050
);


return;

}


setTimeout(
renderClue,
950
);

}


/* ======================================================
   RESET
====================================================== */


function reset(){

if(busy){
return;
}


wakeAudio();


current=[
...clueSnapshot
];


render();


document
.getElementById(
"message"
)
.textContent="";

}


/* ======================================================
   CLUE HINT
====================================================== */


function clueHint(){

if(busy){
return;
}


wakeAudio();


hints++;


updateStats();


const clue=
PUZZLE.clues[
clueIndex
];


const reels=
document
.querySelectorAll(
".reel"
);


const r=
reels[
clue.start
];


r?.classList.remove(
"pulse"
);


void r?.offsetWidth;


r?.classList.add(
"pulse"
);


document
.getElementById(
"message"
)
.textContent=

"Start here.";

}


/* ======================================================
   BANK
====================================================== */


function renderBank(){

const bank=
document.getElementById(
"bank"
);


bank.innerHTML="";


solvedWords.forEach(
(word,i)=>{


const p=
document.createElement(
"div"
);


p.className=
"pill c"+
(i+1);


p.textContent=
word;


bank.appendChild(
p
);

}
);

}


/* ======================================================
   CONNECTION
====================================================== */


function showConnection(){

busy=false;


document
.getElementById(
"controls"
)
.style.display=
"none";


document
.getElementById(
"message"
)
.textContent="";


document
.getElementById(
"clueArea"
)
.style.display=
"none";


const section=
document.getElementById(
"connection"
);


section.classList.add(
"show"
);


const words=
document.getElementById(
"connectionWords"
);


words.innerHTML="";


solvedWords.forEach(
(word,i)=>{


const p=
document.createElement(
"div"
);


p.className=
"pill c"+
(i+1);


p.textContent=
word;


words.appendChild(
p
);

}
);


/*
  Dot count comes from actual answer length.
*/


document
.getElementById(
"connectionLength"
)
.textContent=

"•".repeat(
PUZZLE
.connection
.answer
.length
);

}


/* ======================================================
   CONNECTION HINTS
====================================================== */


function connectionHint(){

wakeAudio();


if(
connectionHintLevel>=3
){
return;
}


connectionHintLevel++;


hints++;


updateStats();


document
.getElementById(
"connectionHint"
)
.textContent=

PUZZLE
.connection[
"hint"+
connectionHintLevel
];


if(
connectionHintLevel===3
){

document
.getElementById(
"connectionHintBtn"
)
.textContent=

"NO MORE HINTS";

}

}


/* ======================================================
   TRY CONNECTION
====================================================== */


function tryConnection(){

wakeAudio();


const input=
document.getElementById(
"connectionInput"
);


const guess=
input
.value
.trim()
.toUpperCase();


if(!guess){
return;
}


attempts++;


updateStats();


if(
guess===
PUZZLE
.connection
.answer
){

completeConnection();

}
else{

wrongSound();


input.classList.add(
"shake"
);


document
.getElementById(
"connectionHint"
)
.textContent=

"That doesn't connect all four.";


setTimeout(
()=>{


input.classList.remove(
"shake"
);


},
350
);

}

}


/* ======================================================
   REVEAL CONNECTION
====================================================== */


function revealConnection(){

wakeAudio();


const answer=
PUZZLE
.connection
.answer;


document
.getElementById(
"connectionInput"
)
.value=
answer;


document
.getElementById(
"connectionHint"
)
.textContent=

"There it is.";


setTimeout(
completeConnection,
650
);

}


/* ======================================================
   COMPLETE CONNECTION
====================================================== */


function completeConnection(){

connectionSound();


const answer=
PUZZLE
.connection
.answer;


const input=
document.getElementById(
"connectionInput"
);


input.value=
answer;


input.disabled=true;


[
"connectBtn",
"connectionHintBtn",
"revealBtn"
]
.forEach(
id=>{


document
.getElementById(
id
)
.disabled=true;


}
);


document
.getElementById(
"connectionLength"
)
.textContent=
answer;


const forms=
solvedWords.map(
word=>
word+
answer
);


const out=
document.getElementById(
"connectionHint"
);


out.textContent="";


let i=0;


function revealNext(){


if(
i>=
forms.length
){

setTimeout(
finish,
900
);


return;

}


out.textContent=

out.textContent

? out.textContent+
"  ·  "+
forms[i]

: forms[i];


tone(
180+(i*28),
.27,
.0065,
"sine"
);


i++;


setTimeout(
revealNext,
430
);

}


setTimeout(
revealNext,
470
);

}


/* ======================================================
   FINISH
====================================================== */


function finish(){

const visited=
histories.filter(
set=>
set.size>0
)
.length;


const connection=
document.getElementById(
"connection"
);


connection.style.transition=
"opacity .8s ease";


connection.style.opacity=
"0";


setTimeout(
()=>{


connection.style.display=
"none";


document
.getElementById(
"finalPath"
)
.textContent=

"TODAY'S TRACE · "+
visited+
" OF 16 PLACES";


document
.getElementById(
"final"
)
.classList.add(
"show"
);


},
800
);

}


/* ======================================================
   STATS
====================================================== */


function updateStats(){

document
.getElementById(
"turnStat"
)
.textContent=

turns+
" TURN"+
(
turns===1
? ""
: "S"
);


document
.getElementById(
"attemptStat"
)
.textContent=

attempts+
" ATTEMPT"+
(
attempts===1
? ""
: "S"
);


document
.getElementById(
"hintStat"
)
.textContent=

hints+
" HINT"+
(
hints===1
? ""
: "S"
);

}


/* ======================================================
   BUTTONS
====================================================== */


document
.getElementById(
"unlockBtn"
)
.addEventListener(
"click",
unlock
);


document
.getElementById(
"resetBtn"
)
.addEventListener(
"click",
reset
);


document
.getElementById(
"hintBtn"
)
.addEventListener(
"click",
clueHint
);


document
.getElementById(
"connectBtn"
)
.addEventListener(
"click",
tryConnection
);


document
.getElementById(
"connectionHintBtn"
)
.addEventListener(
"click",
connectionHint
);


document
.getElementById(
"revealBtn"
)
.addEventListener(
"click",
revealConnection
);


document
.getElementById(
"connectionInput"
)
.addEventListener(
"keydown",
e=>{


if(
e.key==="Enter"
){

tryConnection();

}

}
);


/* ======================================================
   START
====================================================== */


renderClue();

</script>

</body>
</html>
