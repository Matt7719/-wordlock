<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e7ddc9">
<title>WORDLOCK — Prototype #019</title>

<style>
:root{
  --ink:#20211f;
  --alt:#686d68;
  --remembered:#292c29;
  --cream:rgba(248,245,235,.92);

  --sage:#adc1b0;
  --blue:#a9c4cd;
  --ochre:#d0b57a;
  --mauve:#bba8bd;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#e7ddc9;
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Avenir Next",
    "Segoe UI",
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

/* =========================================================
   PLACE
   Visual target: our agreed "1.6".
   Recognisable environment, still interpretive.
========================================================= */

#place{
  position:relative;
  min-height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 72% 16%,
      rgba(173,186,150,.22),
      transparent 40%
    ),
    radial-gradient(
      ellipse at 15% 74%,
      rgba(188,167,127,.18),
      transparent 46%
    ),
    linear-gradient(
      145deg,
      #ebe0ca 0%,
      #e1d5bb 54%,
      #d8c9aa 100%
    );
}

.terrain{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

/* ---------- contours ---------- */

.contours{
  position:absolute;
  width:150%;
  height:1200px;
  left:-25%;
  top:70px;
  opacity:.62;
}

.contours path{
  fill:none;
  stroke:#6f7065;
  stroke-width:1.15;
  vector-effect:non-scaling-stroke;
}

.contours .fine{
  stroke-width:.72;
  opacity:.54;
}

.contours .light{
  stroke:#f4ecd9;
  stroke-width:1;
  opacity:.60;
}

/* ---------- water ---------- */

.water{
  position:absolute;
  left:-12%;
  top:660px;

  width:69%;
  height:330px;

  transform:rotate(-8deg);

  border-radius:
    45% 55% 52% 48% /
    52% 45% 55% 48%;

  background:
    repeating-linear-gradient(
      4deg,
      transparent 0 17px,
      rgba(75,130,140,.13) 18px,
      transparent 19px 32px
    ),
    radial-gradient(
      ellipse at 55% 42%,
      rgba(78,148,161,.50),
      rgba(106,159,164,.31) 48%,
      rgba(119,157,156,.13) 68%,
      transparent 76%
    );

  border:
    1px solid rgba(70,113,118,.23);
}

.water::before,
.water::after{
  content:"";
  position:absolute;

  border:
    1px solid rgba(78,112,111,.22);

  border-radius:50%;
}

.water::before{
  inset:-18px -30px;
}

.water::after{
  inset:-38px -57px;
  opacity:.54;
}

/* very restrained ripple marks */

.ripples{
  position:absolute;
  left:-4%;
  top:745px;

  width:52%;
  height:165px;

  opacity:.36;

  background:
    repeating-radial-gradient(
      ellipse at 30% 50%,
      transparent 0 20px,
      rgba(236,241,226,.55) 21px,
      transparent 22px 35px
    );

  transform:rotate(-8deg);
}

/* ---------- vegetation ---------- */

.vegetation{
  position:absolute;
  right:-9%;
  top:330px;

  width:58%;
  height:520px;

  background:
    radial-gradient(
      ellipse at 70% 45%,
      rgba(103,132,87,.28),
      rgba(116,140,99,.12) 43%,
      transparent 72%
    );
}

.vegetation::before{
  content:"";
  position:absolute;
  inset:0;

  background-image:
    radial-gradient(
      circle,
      rgba(61,91,59,.35) 0 1.15px,
      transparent 1.55px
    ),
    radial-gradient(
      circle,
      rgba(78,103,67,.24) 0 1px,
      transparent 1.45px
    );

  background-size:
    18px 20px,
    29px 27px;

  background-position:
    0 0,
    9px 12px;

  mask-image:
    radial-gradient(
      ellipse at 67% 45%,
      black 0 35%,
      transparent 74%
    );

  -webkit-mask-image:
    radial-gradient(
      ellipse at 67% 45%,
      black 0 35%,
      transparent 74%
    );
}

/*
  Almost-trees.

  Deliberately NOT recognisable tree illustrations.
  Just enough branching/vertical structure that vegetation
  begins to suggest something.
*/

.vegetation::after{
  content:"";
  position:absolute;

  right:10%;
  top:7%;

  width:55%;
  height:56%;

  opacity:.23;

  background:
    repeating-linear-gradient(
      78deg,
      transparent 0 18px,
      rgba(54,81,52,.45) 19px,
      transparent 20px 31px
    );

  mask-image:
    radial-gradient(
      ellipse,
      black 0 38%,
      transparent 72%
    );

  -webkit-mask-image:
    radial-gradient(
      ellipse,
      black 0 38%,
      transparent 72%
    );
}

/* ---------- stone ---------- */

.stone{
  position:absolute;

  right:-26px;
  top:825px;

  width:148px;
  height:190px;

  border-radius:
    53% 47% 58% 42% /
    44% 58% 42% 56%;

  background:
    repeating-linear-gradient(
      162deg,
      transparent 0 17px,
      rgba(84,77,66,.07) 18px,
      transparent 19px 31px
    ),
    linear-gradient(
      135deg,
      rgba(161,143,113,.26),
      rgba(116,107,91,.39)
    );
}

.stone-small{
  position:absolute;

  left:-35px;
  top:560px;

  width:125px;
  height:108px;

  border-radius:
    47% 53% 44% 56%;

  background:
    linear-gradient(
      145deg,
      rgba(159,143,116,.25),
      rgba(113,105,90,.34)
    );
}

/* ---------- suggested path ---------- */

.path{
  position:absolute;

  width:82%;
  height:450px;

  left:37%;
  top:440px;

  border-left:
    2px solid rgba(245,235,210,.34);

  border-radius:50%;

  transform:rotate(22deg);
}

.path::after{
  content:"";
  position:absolute;

  inset:0 0 0 8px;

  border-left:
    1px solid rgba(245,235,210,.24);

  border-radius:50%;
}

/* =========================================================
   LAYOUT
========================================================= */

.wrap{
  position:relative;
  z-index:2;

  width:min(94vw,520px);

  margin:0 auto;

  padding:
    max(30px,env(safe-area-inset-top))
    0
    max(46px,env(safe-area-inset-bottom));
}

header{
  text-align:center;
  margin:23px 0 24px;
}

.brand{
  font-size:14px;
  font-weight:850;
  letter-spacing:.37em;
}

.prototype{
  margin-top:7px;

  font-size:8px;
  font-weight:800;
  letter-spacing:.28em;

  color:#60635c;
}

.where{
  margin-top:15px;

  font-family:Georgia,serif;

  font-size:11px;
  letter-spacing:.22em;

  text-transform:uppercase;
}

.terrain-note{
  margin-top:6px;

  font-family:Georgia,serif;
  font-size:15px;

  color:#5d5d54;
}

/* =========================================================
   CLUE
========================================================= */

.clue-area{
  min-height:111px;

  padding:10px 10px 8px;

  text-align:center;
}

.progress{
  display:flex;
  justify-content:center;

  gap:10px;

  margin-bottom:14px;
}

.progress-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  border:
    1px solid rgba(60,62,57,.63);

  background:
    rgba(249,246,236,.48);

  transition:
    background .6s ease,
    transform .5s ease;
}

.progress-dot.done{
  transform:scale(1.08);
}

.progress-dot.done:nth-child(1){
  background:var(--sage);
  border-color:transparent;
}

.progress-dot.done:nth-child(2){
  background:var(--blue);
  border-color:transparent;
}

.progress-dot.done:nth-child(3){
  background:var(--ochre);
  border-color:transparent;
}

.progress-dot.done:nth-child(4){
  background:var(--mauve);
  border-color:transparent;
}

.clue-label{
  font-size:9px;
  font-weight:800;
  letter-spacing:.26em;

  color:#60635d;
}

#clue{
  max-width:390px;

  min-height:29px;

  margin:7px auto 4px;

  font-family:Georgia,serif;

  font-size:20px;
  line-height:1.25;
}

#length{
  font-size:10px;
  letter-spacing:.22em;

  color:#656861;
}

/* =========================================================
   BOARD
========================================================= */

.board{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px 8px;

  padding:
    10px 9px 6px;

  position:relative;
}

/* no enclosing board */

.reel{
  position:relative;

  height:76px;

  overflow:hidden;

  border:
    1px solid rgba(61,64,58,.23);

  border-radius:17px;

  background:var(--cream);

  box-shadow:
    0 5px 13px rgba(52,49,42,.11),
    inset 0 1px 0 rgba(255,255,255,.82);

  user-select:none;
  -webkit-user-select:none;

  touch-action:pan-y;

  transition:
    background .65s ease,
    box-shadow .38s ease,
    transform .38s cubic-bezier(.22,.75,.26,1);
}

/*
  The three visible letters now live on a little physical strip.
*/

.reel-strip{
  position:absolute;

  inset:0;

  display:grid;

  grid-template-columns:
    1fr 1.28fr 1fr;

  align-items:center;

  text-align:center;

  will-change:transform;
}

.letter{
  display:flex;
  align-items:center;
  justify-content:center;

  line-height:1;

  transition:
    font-size .26s ease,
    opacity .26s ease,
    color .26s ease,
    transform .26s ease;
}

.letter.alt{
  font-size:17px;
  font-weight:520;

  color:var(--alt);
}

.letter.alt.remembered{
  color:var(--remembered);
  font-weight:820;
}

.letter.current{
  font-size:31px;
  font-weight:860;

  color:var(--ink);
}

/* =========================================================
   REEL MOTION

   Important difference from 018:
   the letters visibly travel before the reel settles.
========================================================= */

.reel.cycle-left .reel-strip{
  animation:
    reelLeft .32s
    cubic-bezier(.25,.70,.25,1);
}

.reel.cycle-right .reel-strip{
  animation:
    reelRight .32s
    cubic-bezier(.25,.70,.25,1);
}

@keyframes reelLeft{

  0%{
    transform:translateX(0);
  }

  68%{
    transform:translateX(-15%);
  }

  84%{
    transform:translateX(-12%);
  }

  100%{
    transform:translateX(0);
  }
}

@keyframes reelRight{

  0%{
    transform:translateX(0);
  }

  68%{
    transform:translateX(15%);
  }

  84%{
    transform:translateX(12%);
  }

  100%{
    transform:translateX(0);
  }
}

/* tiny physical settle */

.reel.settle{
  animation:
    settle .26s ease;
}

@keyframes settle{

  0%{
    transform:scale(1);
  }

  55%{
    transform:scale(.985);
  }

  100%{
    transform:scale(1);
  }
}

.reel.confirming{
  transform:scale(1.045);

  box-shadow:
    0 0 0 3px rgba(255,255,255,.34),
    0 8px 17px rgba(50,47,40,.13);
}

.reel.pulse{
  animation:
    pulse 1.05s
    ease-in-out 2;
}

@keyframes pulse{

  50%{
    transform:scale(1.055);

    box-shadow:
      0 0 0 4px rgba(60,65,58,.11),
      0 7px 16px rgba(50,48,42,.13);
  }
}

/* =========================================================
   COLOUR TRACES
========================================================= */

.reel.used1{
  background:
    rgba(173,193,176,.93);
}

.reel.used2{
  background:
    rgba(169,196,205,.93);
}

.reel.used3{
  background:
    rgba(208,181,122,.93);
}

.reel.used4{
  background:
    rgba(187,168,189,.93);
}

.reel.mix12{
  background:
    linear-gradient(
      135deg,
      var(--sage),
      var(--blue)
    );
}

.reel.mix13{
  background:
    linear-gradient(
      135deg,
      var(--sage),
      var(--ochre)
    );
}

.reel.mix14{
  background:
    linear-gradient(
      135deg,
      var(--sage),
      var(--mauve)
    );
}

.reel.mix23{
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--ochre)
    );
}

.reel.mix24{
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--mauve)
    );
}

.reel.mix34{
  background:
    linear-gradient(
      135deg,
      var(--ochre),
      var(--mauve)
    );
}

/* =========================================================
   CONTROLS
========================================================= */

.controls{
  display:grid;

  grid-template-columns:
    1fr 1.65fr 1fr;

  gap:9px;

  padding:0 9px;

  margin-top:16px;
}

.btn{
  min-height:49px;

  border:
    1px solid rgba(52,54,50,.40);

  border-radius:16px;

  background:
    rgba(247,243,232,.84);

  color:#343632;

  font-size:10px;
  font-weight:800;

  letter-spacing:.14em;
}

.btn.primary{
  background:#30322e;

  color:#f8f5eb;

  border-color:#30322e;
}

.btn:active{
  transform:translateY(1px);
}

#message{
  min-height:36px;

  padding-top:10px;

  text-align:center;

  font-family:Georgia,serif;
  font-style:italic;

  font-size:14px;

  color:#55584f;
}

/* =========================================================
   BANK / STATS
========================================================= */

.bank{
  min-height:38px;

  margin-top:5px;

  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:7px;
}

.pill{
  opacity:0;

  transform:
    translateY(5px)
    scale(.97);

  padding:
    7px 12px;

  border-radius:999px;

  font-size:11px;
  font-weight:800;

  letter-spacing:.08em;

  animation:
    pillIn .65s
    cubic-bezier(.22,.72,.26,1)
    forwards;
}

@keyframes pillIn{

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }
}

.pill.c1{background:var(--sage)}
.pill.c2{background:var(--blue)}
.pill.c3{background:var(--ochre)}
.pill.c4{background:var(--mauve)}

.stats{
  display:flex;
  justify-content:center;

  gap:22px;

  margin-top:8px;

  font-size:9px;
  font-weight:800;

  letter-spacing:.14em;

  color:#565951;
}

/* =========================================================
   CONNECTION
========================================================= */

.connection{
  display:none;

  margin:
    28px 10px 0;

  padding:
    25px 12px 22px;

  border-top:
    1px solid rgba(64,66,59,.25);

  text-align:center;
}

.connection.show{
  display:block;

  animation:
    gentleIn .9s ease both;
}

@keyframes gentleIn{

  from{
    opacity:0;
    transform:translateY(7px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.connection-title{
  font-size:9px;
  font-weight:800;

  letter-spacing:.27em;

  color:#5c5f58;
}

.connection-copy{
  margin:8px 0 12px;

  font-family:Georgia,serif;

  font-size:20px;
}

.connection-words{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:7px;
}

.connection-length{
  margin:
    15px 0 6px;

  font-size:20px;
  font-weight:800;

  letter-spacing:.32em;

  color:#55584f;
}

.connection-input{
  width:min(250px,82%);

  border:0;

  border-bottom:
    1px solid #696b63;

  border-radius:0;

  background:transparent;

  padding:8px;

  outline:none;

  text-align:center;
  text-transform:uppercase;

  font-size:23px;
  font-weight:800;

  letter-spacing:.14em;

  color:#252724;
}

.connection-actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:8px;

  margin-top:14px;
}

.connection-actions .btn{
  padding:0 17px;
}

#connectionHint{
  max-width:340px;
  min-height:46px;

  margin:13px auto 0;

  font-family:Georgia,serif;
  font-style:italic;

  font-size:14px;
  line-height:1.4;

  color:#55584f;
}

/* =========================================================
   FINISH
========================================================= */

.final{
  display:none;

  margin:
    28px 12px 0;

  padding:
    27px 10px;

  text-align:center;
}

.final.show{
  display:block;

  animation:
    gentleIn 1.3s ease both;
}

.final-kicker{
  font-size:9px;
  font-weight:800;

  letter-spacing:.27em;
}

.final-title{
  margin-top:8px;

  font-family:Georgia,serif;

  font-size:28px;
}

.final-copy{
  max-width:325px;

  margin:8px auto;

  font-family:Georgia,serif;

  font-size:15px;
  line-height:1.5;

  color:#50534c;
}

/*
  Deliberately factual for this prototype.
  We are NOT pretending route choice is meaningful
  until the route-ownership experiment earns it.
*/

.final-path{
  margin-top:17px;

  font-size:10px;
  font-weight:800;

  letter-spacing:.15em;

  color:#50534c;
}

/* ========================================================= */

.shake{
  animation:
    shake .30s linear;
}

@keyframes shake{

  25%{transform:translateX(-4px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-2px)}
}

@media(max-width:390px){

  .board{
    gap:10px 7px;
  }

  .reel{
    height:70px;
    border-radius:15px;
  }

  .letter.alt{
    font-size:16px;
  }

  .letter.current{
    font-size:29px;
  }

  #clue{
    font-size:19px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

  <div class="terrain">

        C460 255 610 225 770 105
      "/>

      <path d="
        M-70 190

        C430 285 590 280 770 150
      "/>

      <path class="fine" d="

    <div class="vegetation"></div>

  </div>

  <main class="wrap">

    <header>

      <div class="brand">
        WORDLOCK
      </div>

      <div class="prototype">
        PROTOTYPE #019

      </div>

      <div class="terrain-note">

      </div>

    </header>

    <section
      class="clue-area"
      id="clueArea">

      <div class="progress">

        <div class="progress-dot"></div>

        <div class="progress-dot"></div>

      </div>

      <div

        id="clueLabel">

      </button>

      id="bank">
    </div>

      <span id="turnStat">

      </span>

    </div>

      class="connection"
      id="connection">

      </div>

      <div

        id="connectionWords">
      </div>

        id="connectionLength">
      </div>

      <input
        id="connectionInput"
        class="connection-input"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        maxlength="12"
        aria-label="Connecting word">

      <div class="connection-actions">

        <button
          class="btn primary"
          id="connectBtn">
          CONNECT
        </button>

        <button
          class="btn"
          id="connectionHintBtn">
          HINT
        </button>

        <button
          class="btn"
          id="revealBtn">
          REVEAL
        </button>

      </div>

      <div id="connectionHint"></div>

    </section>

    <section
      class="final"
      id="final">

      <div class="final-kicker">
        A FIRST TRACE
      </div>

      <div class="final-title">
        Your path remains.
      </div>

      <div class="final-copy">
        This place is a little different
        because you passed through it.
      </div>

      <div
        class="final-path"
        id="finalPath">
      </div>

    </section>

  </main>
</div>

<script>

/* =========================================================
   WORDLOCK — PROTOTYPE #019
========================================================= */


/*
  Puzzle deliberately kept structurally straightforward.

  #019 is primarily testing:
  - 1.6 environmental language
  - reel movement
  - reel sound
  - overall tactile/atmospheric feel

  Route ownership remains a later controlled experiment.
*/

const PUZZLE={

  wheels:[

    ["B","C","M"],
    ["R","A","L"],
    ["T","N","O"],
    ["D","S","P"],

    ["E","G","H"],
    ["L","I","Y"],
    ["R","V","K"],
    ["A","J","U"],

    ["N","Q","F"],
    ["I","X","E"],
    ["M","U","S"],
    ["R","W","N"],

    ["R","D","F"],
    ["B","N","G"],
    ["C","T","P"],
    ["H","V","K"]
  ],

  clues:[

    {
      answer:"CALM",
      clue:"Peaceful and without agitation",
      start:0,
      colour:1
    },

    {
      answer:"GLOW",
      clue:"A steady, gentle light",
      start:4,
      colour:2
    },

    {
      answer:"FINE",
      clue:"Delicate or very slight",
      start:8,
      colour:3
    },

    {
      answer:"PATH",
      clue:"A way through a place",
      start:3,
      colour:4
    }

  ],

  connection:{

    answer:"LINE",

    hint1:
      "The connecting word comes after all four answers.",

    hint2:
      "Think of something that can be drawn, followed or crossed.",

    hint3:
      "A single word can follow CALM, GLOW, FINE and PATH."
  }

};


/* =========================================================
   STATE
========================================================= */

let clueIndex=0;

let current=
  PUZZLE.wheels.map(()=>1);

let clueSnapshot=
  [...current];

let remembered=
  PUZZLE.wheels.map(
    ()=>new Set()
  );

let histories=
  PUZZLE.wheels.map(
    ()=>new Set()
  );

let solvedWords=[];

let turns=0;
let attempts=0;
let hints=0;

let connectionHintLevel=0;

let busy=false;


/* =========================================================
   ETHEREAL-MECHANICAL AUDIO

   Still generated in-browser, therefore zero external assets.
   But movement is now layered:
   - quiet physical tick
   - soft resonant tone
   - very faint higher shimmer

   This is an experiment, not final sound design.
========================================================= */

let audioCtx=null;


function ensureAudio(){

  const AC=
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AC)return;

  if(!audioCtx){
    audioCtx=new AC();
  }

  if(
    audioCtx.state===
    "suspended"
  ){
    audioCtx.resume();
  }
}


function oscillatorTone(
  frequency,
  duration,
  volume,
  type="sine",
  delay=0
){

  ensureAudio();

  if(!audioCtx)return;

  const now=
    audioCtx.currentTime+
    delay;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type;

  osc.frequency
    .setValueAtTime(
      frequency,
      now
    );

  gain.gain
    .setValueAtTime(
      .0001,
      now
    );

  gain.gain
    .exponentialRampToValueAtTime(
      volume,
      now+.008
    );

  gain.gain
    .exponentialRampToValueAtTime(
      .0001,
      now+duration
    );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start(now);

  osc.stop(
    now+
    duration+
    .03
  );
}


/*
  Each board position gets a subtly different resonance.
  Not intended to sound like a tune.
*/

const REEL_PITCHES=[
  196,207,220,233,
  185,196,208,220,
  174,185,196,208,
  165,174,185,196
];


function reelSound(index){

  const root=
    REEL_PITCHES[index];

  /* tiny mechanism */
  oscillatorTone(
    105,
    .035,
    .009,
    "triangle"
  );

  /* body */
  oscillatorTone(
    root,
    .19,
    .012,
    "sine",
    .018
  );

  /* faint shimmer */
  oscillatorTone(
    root*2.01,
    .27,
    .0045,
    "sine",
    .035
  );
}


function wrongSound(){

  oscillatorTone(
    110,
    .12,
    .018,
    "triangle"
  );

  oscillatorTone(
    82,
    .19,
    .010,
    "sine",
    .025
  );
}


function pathSound(step){

  const notes=[
    196,
    220,
    247,
    277,
    294,
    330
  ];

  const f=
    notes[
      Math.min(
        step,
        notes.length-1
      )
    ];

  oscillatorTone(
    f,
    .24,
    .010,
    "sine"
  );

  oscillatorTone(
    f*2,
    .34,
    .003,
    "sine",
    .025
  );
}


function connectionSound(){

  const notes=[
    196,
    247,
    294,
    370
  ];

  notes.forEach(
    (n,i)=>{

      oscillatorTone(
        n,
        .38,
        .009,
        "sine",
        i*.12
      );

      oscillatorTone(
        n*2,
        .48,
        .0025,
        "sine",
        i*.12+.025
      );
    }
  );
}


/* =========================================================
   HELPERS
========================================================= */

function letterAt(i){

  return(
    PUZZLE.wheels[i]
    [current[i]]
  );
}


function adjacent(a,b){

  const ar=
    Math.floor(a/4);

  const ac=
    a%4;

  const br=
    Math.floor(b/4);

  const bc=
    b%4;

  return(
    Math.max(
      Math.abs(ar-br),
      Math.abs(ac-bc)
    )===1
  );
}


function findPaths(word){

  const results=[];


  function walk(
    position,
    index,
    path
  ){

    if(
      index===
      word.length
    ){

      results.push(
        [...path]
      );

      return;
    }


    for(
      let i=0;
      i<16;
      i++
    ){

      if(
        path.includes(i)
      )continue;

      if(
        letterAt(i)!==
        word[index]
      )continue;

      if(
        position!==null &&
        !adjacent(
          position,
          i
        )
      )continue;


      path.push(i);

      walk(
        i,
        index+1,
        path
      );

      path.pop();
    }
  }


  walk(
    null,
    0,
    []
  );

  return results;
}


/* =========================================================
   RENDER BOARD
========================================================= */

function render(){

  const board=
    document.getElementById(
      "board"
    );

  board.innerHTML="";


  PUZZLE.wheels.forEach(
    (wheel,i)=>{

      const reel=
        document.createElement(
          "div"
        );

      reel.className="reel";

      applyHistory(
        reel,
        i
      );


      const centre=
        current[i];

      const left=
        (centre+2)%3;

      const right=
        (centre+1)%3;


      const strip=
        document.createElement(
          "div"
        );

      strip.className=
        "reel-strip";


      [
        {
          idx:left,
          type:"alt"
        },
        {
          idx:centre,
          type:"current"
        },
        {
          idx:right,
          type:"alt"
        }
      ].forEach(
        item=>{

          const el=
            document.createElement(
              "div"
            );

          el.className=
            "letter "+
            item.type;

          const letter=
            wheel[item.idx];


          if(
            item.type===
            "alt" &&
            remembered[i]
              .has(letter)
          ){

            el.classList.add(
              "remembered"
            );
          }


          el.textContent=
            letter;

          strip.appendChild(
            el
          );
        }
      );


      reel.appendChild(
        strip
      );


      let startX=null;


      reel.addEventListener(
        "pointerdown",
        e=>{

          if(busy)return;

          ensureAudio();

          startX=
            e.clientX;

          reel
            .setPointerCapture?.(
              e.pointerId
            );
        }
      );


      reel.addEventListener(
        "pointerup",
        e=>{

          if(
            busy ||
            startX===null
          )return;


          const dx=
            e.clientX-
            startX;

          startX=null;


          if(
            Math.abs(dx)<16
          )return;


          animateTurn(
            i,
            dx<0 ? 1 : -1
          );
        }
      );


      board.appendChild(
        reel
      );
    }
  );


  updateStats();
}


/* =========================================================
   HISTORY COLOUR
========================================================= */

function applyHistory(
  reel,
  index
){

  const colours=
    [...histories[index]];


  if(
    colours.length===1
  ){

    reel.classList.add(
      "used"+
      colours[0]
    );

    return;
  }


  if(
    colours.length>=2
  ){

    const a=
      Math.min(
        ...colours
      );

    const b=
      Math.max(
        ...colours
      );

    const mix=
      "mix"+a+b;


    if(
      [
        "mix12",
        "mix13",
        "mix14",
        "mix23",
        "mix24",
        "mix34"
      ].includes(mix)
    ){

      reel.classList.add(
        mix
      );
    }
  }
}


/* =========================================================
   REEL TURN

   Animate first.
   Change state at the settling point.
========================================================= */

function animateTurn(
  index,
  direction
){

  if(busy)return;

  busy=true;

  ensureAudio();

  const reel=
    document
      .querySelectorAll(
        ".reel"
      )[index];


  reel.classList.add(
    direction===1
      ? "cycle-left"
      : "cycle-right"
  );


  reelSound(index);


  /*
    Wait until the motion is visibly underway
    before replacing the letter state.
  */

  setTimeout(()=>{

    current[index]=
      (
        current[index]+
        direction+
        3
      )%3;

    turns++;

    render();


    const fresh=
      document
        .querySelectorAll(
          ".reel"
        )[index];

    fresh?.classList.add(
      "settle"
    );


    setTimeout(()=>{

      fresh?.classList.remove(
        "settle"
      );

      busy=false;

    },260);

  },215);
}


/* =========================================================
   CLUE
========================================================= */

function renderClue(){

  busy=false;

  const clue=
    PUZZLE.clues[
      clueIndex
    ];


  document
    .getElementById(
      "clueLabel"
    )
    .textContent=
      "CLUE "+
      (clueIndex+1);


  document
    .getElementById(
      "clue"
    )
    .textContent=
      clue.clue;


  document
    .getElementById(
      "length"
    )
    .textContent=
      clue.answer.length+
      " LETTERS";


  document
    .getElementById(
      "message"
    )
    .textContent="";


  render();


  setTimeout(()=>{

    const reels=
      document
        .querySelectorAll(
          ".reel"
        );

    reels[
      clue.start
    ]?.classList.add(
      "pulse"
    );

  },400);
}


/* =========================================================
   UNLOCK
========================================================= */

function unlock(){

  if(busy)return;

  ensureAudio();

  attempts++;

  updateStats();


  const clue=
    PUZZLE.clues[
      clueIndex
    ];


  const paths=
    findPaths(
      clue.answer
    );


  if(
    !paths.length
  ){

    wrongSound();

    busy=true;

    const board=
      document
        .getElementById(
          "board"
        );


    board.classList.add(
      "shake"
    );


    document
      .getElementById(
        "message"
      )
      .textContent=
        "Not quite. The place settles back.";


    setTimeout(()=>{

      board.classList.remove(
        "shake"
      );

      current=[
        ...clueSnapshot
      ];

      render();

      busy=false;

    },720);


    return;
  }


  /*
    #019 is not attempting to solve route ownership.
    If multiple paths happen to exist in a displayed state,
    this build uses the first valid path.

    That is explicit technical debt, not our final rule.
  */

  solve(
    clue,
    paths[0]
  );
}


/* =========================================================
   SUCCESS SEQUENCE
========================================================= */

function solve(
  clue,
  path
){

  busy=true;


  document
    .getElementById(
      "message"
    )
    .textContent="";


  path.forEach(
    (position,n)=>{

      remembered[position]
        .add(
          clue.answer[n]
        );
    }
  );


  let step=0;


  function colourNext(){

    if(
      step>=
      path.length
    ){

      setTimeout(
        ()=>completeWord(
          clue,
          path
        ),
        380
      );

      return;
    }


    const position=
      path[step];


    histories[position]
      .add(
        clue.colour
      );


    render();


    const reel=
      document
        .querySelectorAll(
          ".reel"
        )[position];


    reel?.classList.add(
      "confirming"
    );


    pathSound(step);


    setTimeout(()=>{

      reel?.classList.remove(
        "confirming"
      );

    },300);


    step++;


    setTimeout(
      colourNext,
      155
    );
  }


  colourNext();
}


function completeWord(
  clue,
  path
){

  solvedWords.push(
    clue.answer
  );


  renderBank();


  document
    .querySelectorAll(
      ".progress-dot"
    )[clueIndex]
    .classList.add(
      "done"
    );


  document
    .getElementById(
      "message"
    )
    .textContent=
      clue.answer+
      " found.";


  /*
    Irrelevant experiments return.
    Successful path state carries forward.
  */

  const next=[
    ...clueSnapshot
  ];


  path.forEach(
    i=>{

      next[i]=
        current[i];
    }
  );


  current=next;

  clueSnapshot=[
    ...current
  ];


  clueIndex++;


  if(
    clueIndex>=
    PUZZLE.clues.length
  ){

    setTimeout(
      showConnection,
      1000
    );

    return;
  }


  setTimeout(
    renderClue,
    900
  );
}


/* =========================================================
   RESET / HINT
========================================================= */

function reset(){

  if(busy)return;

  ensureAudio();

  current=[
    ...clueSnapshot
  ];

  render();

  document
    .getElementById(
      "message"
    )
    .textContent="";
}


function clueHint(){

  if(busy)return;

  hints++;

  updateStats();


  const clue=
    PUZZLE.clues[
      clueIndex
    ];


  const reels=
    document
      .querySelectorAll(
        ".reel"
      );


  const r=
    reels[
      clue.start
    ];


  r?.classList.remove(
    "pulse"
  );

  void r?.offsetWidth;

  r?.classList.add(
    "pulse"
  );


  document
    .getElementById(
      "message"
    )
    .textContent=
      "Start here.";
}


/* =========================================================
   BANK
========================================================= */

function renderBank(){

  const bank=
    document.getElementById(
      "bank"
    );

  bank.innerHTML="";


  solvedWords.forEach(
    (word,i)=>{

      const p=
        document.createElement(
          "div"
        );

      p.className=
        "pill c"+
        (i+1);

      p.textContent=
        word;

      bank.appendChild(
        p
      );
    }
  );
}


/* =========================================================
   CONNECTION
========================================================= */

function showConnection(){

  busy=false;


  document
    .getElementById(
      "controls"
    )
    .style.display=
      "none";


  document
    .getElementById(
      "message"
    )
    .textContent="";


  document
    .getElementById(
      "clueArea"
    )
    .style.display=
      "none";


  const section=
    document.getElementById(
      "connection"
    );


  section.classList.add(
    "show"
  );


  const words=
    document.getElementById(
      "connectionWords"
    );


  words.innerHTML="";


  solvedWords.forEach(
    (word,i)=>{

      const p=
        document.createElement(
          "div"
        );

      p.className=
        "pill c"+
        (i+1);

      p.textContent=
        word;

      words.appendChild(
        p
      );
    }
  );


  document
    .getElementById(
      "connectionLength"
    )
    .textContent=
      "•".repeat(
        PUZZLE
          .connection
          .answer
          .length
      );
}


function connectionHint(){

  ensureAudio();


  if(
    connectionHintLevel>=3
  )return;


  connectionHintLevel++;

  hints++;

  updateStats();


  document
    .getElementById(
      "connectionHint"
    )
    .textContent=
      PUZZLE
        .connection[
          "hint"+
          connectionHintLevel
        ];


  if(
    connectionHintLevel===3
  ){

    document
      .getElementById(
        "connectionHintBtn"
      )
      .textContent=
        "NO MORE HINTS";
  }
}


function tryConnection(){

  ensureAudio();


  const input=
    document.getElementById(
      "connectionInput"
    );


  const guess=
    input
      .value
      .trim()
      .toUpperCase();


  if(!guess)return;


  attempts++;

  updateStats();


  if(
    guess===
    PUZZLE
      .connection
      .answer
  ){

    completeConnection();

  }else{

    wrongSound();


    input.classList.add(
      "shake"
    );


    document
      .getElementById(
        "connectionHint"
      )
      .textContent=
        "That doesn't connect all four.";


    setTimeout(
      ()=>{

        input.classList.remove(
          "shake"
        );

      },
      350
    );
  }
}


function revealConnection(){

  ensureAudio();


  const answer=
    PUZZLE
      .connection
      .answer;


  document
    .getElementById(
      "connectionInput"
    )
    .value=
      answer;


  document
    .getElementById(
      "connectionHint"
    )
    .textContent=
      "There it is.";


  setTimeout(
    completeConnection,
    600
  );
}


function completeConnection(){

  connectionSound();


  const answer=
    PUZZLE
      .connection
      .answer;


  const input=
    document.getElementById(
      "connectionInput"
    );


  input.value=
    answer;

  input.disabled=
    true;


  [
    "connectBtn",
    "connectionHintBtn",
    "revealBtn"
  ].forEach(
    id=>{

      document
        .getElementById(id)
        .disabled=true;
    }
  );


  document
    .getElementById(
      "connectionLength"
    )
    .textContent=
      answer;


  const forms=
    solvedWords.map(
      word=>
        word+
        answer
    );


  const out=
    document.getElementById(
      "connectionHint"
    );


  out.textContent="";


  let i=0;


  function revealNext(){

    if(
      i>=
      forms.length
    ){

      setTimeout(
        finish,
        850
      );

      return;
    }


    out.textContent=
      out.textContent
        ? out.textContent+
          "  ·  "+
          forms[i]
        : forms[i];


    oscillatorTone(
      190+(i*30),
      .25,
      .007,
      "sine"
    );


    i++;


    setTimeout(
      revealNext,
      410
    );
  }


  setTimeout(
    revealNext,
    450
  );
}


/* =========================================================
   FINISH
========================================================= */

function finish(){

  const visited=
    histories.filter(
      set=>
        set.size>0
    ).length;


  const connection=
    document.getElementById(
      "connection"
    );


  connection.style.transition=
    "opacity .8s ease";

  connection.style.opacity=
    "0";


  setTimeout(()=>{

    connection.style.display=
      "none";


    /*
      Wording deliberately avoids claiming
      that higher coverage = better.
    */

    document
      .getElementById(
        "finalPath"
      )
      .textContent=
        "TODAY'S TRACE · "+
        visited+
        " OF 16 PLACES";


    document
      .getElementById(
        "final"
      )
      .classList.add(
        "show"
      );

  },800);
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  document
    .getElementById(
      "turnStat"
    )
    .textContent=
      turns+
      " TURN"+
      (
        turns===1
          ? ""
          : "S"
      );


  document
    .getElementById(
      "attemptStat"
    )
    .textContent=
      attempts+
      " ATTEMPT"+
      (
        attempts===1
          ? ""
          : "S"
      );


  document
    .getElementById(
      "hintStat"
    )
    .textContent=
      hints+
      " HINT"+
      (
        hints===1
          ? ""
          : "S"
      );
}


/* =========================================================
   BUTTONS
========================================================= */

document
  .getElementById(
    "unlockBtn"
  )
  .addEventListener(
    "click",
    unlock
  );


document
  .getElementById(
    "resetBtn"
  )
  .addEventListener(
    "click",
    reset
  );


document
  .getElementById(
    "hintBtn"
  )
  .addEventListener(
    "click",
    clueHint
  );


document
  .getElementById(
    "connectBtn"
  )
  .addEventListener(
    "click",
    tryConnection
  );


document
  .getElementById(
    "connectionHintBtn"
  )
  .addEventListener(
    "click",
    connectionHint
  );


document
  .getElementById(
    "revealBtn"
  )
  .addEventListener(
    "click",
    revealConnection
  );


document
  .getElementById(
    "connectionInput"
  )
  .addEventListener(
    "keydown",
    e=>{

      if(
        e.key==="Enter"
      ){
        tryConnection();
      }
    }
  );


/* =========================================================
   START
========================================================= */

renderClue();

</script>

</body>
</html>
