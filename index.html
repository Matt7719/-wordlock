<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e9e4d9">

<title>WORDLOCK 017</title>

<style>
:root{
  --ink:#242522;
  --charcoal:#3f413d;
  --grey:#777a74;
  --paper:#eee9df;
  --cream:rgba(250,248,241,.88);

  --sage:#aebca5;
  --blue:#a9bec4;
  --ochre:#c8b48c;
  --mauve:#b8a8b5;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#d9d4c9;
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Avenir Next",
    "Segoe UI",
    sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  touch-action:manipulation;
}

#world{
  min-height:100vh;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 17% 18%,
      rgba(185,196,190,.38) 0%,
      rgba(185,196,190,.14) 24%,
      transparent 47%
    ),
    radial-gradient(
      ellipse at 87% 69%,
      rgba(175,166,145,.30) 0%,
      rgba(175,166,145,.10) 27%,
      transparent 52%
    ),
    linear-gradient(
      154deg,
      #e8e4d9 0%,
      #ddd9cd 45%,
      #d5d0c3 100%
    );
}

/* -------------------------------------------------
   TERRAIN
   Everything is deliberately expressed through the
   same cartographic/topographical visual language.
-------------------------------------------------- */

.terrain{
  position:absolute;
  inset:-7%;
  pointer-events:none;
  opacity:.92;
}

.contours{
  position:absolute;
  inset:0;
  opacity:.47;
  background-image:
    repeating-radial-gradient(
      ellipse at 14% 28%,
      transparent 0 24px,
      rgba(82,88,81,.18) 25px 26px,
      transparent 27px 43px
    ),
    repeating-radial-gradient(
      ellipse at 82% 63%,
      transparent 0 31px,
      rgba(82,88,81,.13) 32px 33px,
      transparent 34px 52px
    );
  transform:rotate(-7deg) scale(1.15);
}

/* subtle water-like basin */
.basin{
  position:absolute;
  width:56%;
  height:25%;
  left:-8%;
  top:50%;
  border-radius:48% 52% 55% 45%;
  transform:rotate(-11deg);
  background:
    repeating-linear-gradient(
      3deg,
      rgba(110,139,143,.00) 0 11px,
      rgba(110,139,143,.12) 12px,
      rgba(110,139,143,.00) 13px 23px
    ),
    radial-gradient(
      ellipse,
      rgba(133,158,159,.18),
      rgba(133,158,159,.04) 58%,
      transparent 73%
    );
  filter:blur(.15px);
}

/* fine organic texture rather than a green blob */
.growth{
  position:absolute;
  right:-4%;
  top:9%;
  width:49%;
  height:42%;
  opacity:.38;
  background-image:
    radial-gradient(circle,rgba(91,107,86,.28) 0 1px,transparent 1.5px),
    radial-gradient(circle,rgba(91,107,86,.17) 0 1px,transparent 1.4px);
  background-size:17px 19px,29px 31px;
  background-position:0 0,8px 12px;
  mask-image:radial-gradient(ellipse at 65% 35%,black 0 32%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse at 65% 35%,black 0 32%,transparent 72%);
}

/* possible track — ambiguous rather than illustrated */
.track,
.track:after{
  position:absolute;
  content:"";
  width:68%;
  height:42%;
  left:34%;
  top:61%;
  border-top:1px solid rgba(92,91,81,.23);
  border-radius:50%;
  transform:rotate(-14deg);
}

.track:after{
  width:100%;
  height:100%;
  left:0;
  top:6px;
  opacity:.65;
}

/* faint geological marks */
.strata{
  position:absolute;
  left:4%;
  top:8%;
  width:42%;
  height:30%;
  opacity:.25;
  background:
    repeating-linear-gradient(
      164deg,
      transparent 0 17px,
      rgba(95,91,79,.22) 18px,
      transparent 19px 31px
    );
  clip-path:polygon(0 15%,70% 0,100% 64%,58% 100%,8% 76%);
}

/* ------------------------------------------------- */

.wrap{
  position:relative;
  z-index:2;
  width:min(94vw,520px);
  margin:0 auto;
  padding:
    max(25px,env(safe-area-inset-top))
    0
    max(34px,env(safe-area-inset-bottom));
}

.mast{
  text-align:center;
  margin-bottom:15px;
}

.brand{
  font-size:13px;
  letter-spacing:.34em;
  font-weight:750;
}

.place{
  margin-top:8px;
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:.19em;
  text-transform:uppercase;
  color:#65675f;
}

.place-detail{
  margin-top:5px;
  font-family:Georgia,serif;
  font-style:italic;
  font-size:12px;
  color:#7b7b70;
}

.panel{
  background:rgba(243,240,231,.58);
  border:1px solid rgba(76,76,67,.16);
  border-radius:25px;
  padding:17px 14px 16px;
  box-shadow:
    0 18px 50px rgba(57,55,48,.10),
    inset 0 1px rgba(255,255,255,.55);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}

.progress{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:13px;
}

.progress-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  border:1px solid #797b75;
  background:rgba(255,255,255,.38);
}

.progress-dot.done:nth-child(1){background:var(--sage);border-color:transparent}
.progress-dot.done:nth-child(2){background:var(--blue);border-color:transparent}
.progress-dot.done:nth-child(3){background:var(--ochre);border-color:transparent}
.progress-dot.done:nth-child(4){background:var(--mauve);border-color:transparent}

.clue-label{
  text-align:center;
  font-size:9px;
  font-weight:750;
  letter-spacing:.24em;
  color:#74766f;
}

#clue{
  min-height:44px;
  margin:5px auto 3px;
  max-width:370px;
  text-align:center;
  font-family:Georgia,serif;
  font-size:18px;
  line-height:1.25;
}

#length{
  text-align:center;
  font-size:10px;
  letter-spacing:.20em;
  color:#74766f;
  margin-bottom:15px;
}

.board{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.reel{
  position:relative;
  height:65px;
  border:1px solid rgba(57,59,54,.18);
  border-radius:14px;
  background:rgba(252,250,244,.84);
  box-shadow:
    0 4px 10px rgba(54,52,45,.08),
    inset 0 1px rgba(255,255,255,.8);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  touch-action:pan-y;

  transition:
    background .55s ease,
    transform .14s ease,
    box-shadow .3s ease;
}

.reel-inner{
  height:100%;
  display:grid;
  grid-template-columns:1fr 1.25fr 1fr;
  align-items:center;
  text-align:center;
}

.letter{
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
}

/* UNUSED alternatives:
   deliberately readable, not ghosted away */
.letter.alt{
  font-size:17px;
  font-weight:500;
  color:var(--grey);
}

/* Previously successful letter:
   NO BROWN. Typography alone carries the meaning. */
.letter.alt.remembered{
  color:#30322f;
  font-weight:800;
}

/* Current */
.letter.current{
  font-size:30px;
  font-weight:850;
  color:#1f211f;
  letter-spacing:-.03em;
}

.reel.used1{background:rgba(174,188,165,.88)}
.reel.used2{background:rgba(169,190,196,.88)}
.reel.used3{background:rgba(200,180,140,.88)}
.reel.used4{background:rgba(184,168,181,.88)}

/* overlap approximations */
.reel.mix12{background:linear-gradient(135deg,rgba(174,188,165,.90),rgba(169,190,196,.90))}
.reel.mix13{background:linear-gradient(135deg,rgba(174,188,165,.90),rgba(200,180,140,.90))}
.reel.mix14{background:linear-gradient(135deg,rgba(174,188,165,.90),rgba(184,168,181,.90))}
.reel.mix23{background:linear-gradient(135deg,rgba(169,190,196,.90),rgba(200,180,140,.90))}
.reel.mix24{background:linear-gradient(135deg,rgba(169,190,196,.90),rgba(184,168,181,.90))}
.reel.mix34{background:linear-gradient(135deg,rgba(200,180,140,.90),rgba(184,168,181,.90))}

.reel.pulse{
  animation:pulse 1.05s ease-in-out 2;
}

@keyframes pulse{
  50%{
    transform:scale(1.055);
    box-shadow:
      0 0 0 4px rgba(70,75,68,.10),
      0 7px 16px rgba(54,52,45,.12);
  }
}

.controls{
  display:grid;
  grid-template-columns:1fr 1.6fr 1fr;
  gap:8px;
  margin-top:14px;
}

.btn{
  border:1px solid rgba(54,56,52,.22);
  border-radius:13px;
  min-height:45px;
  background:rgba(248,246,239,.78);
  color:#3b3d39;
  font-size:10px;
  font-weight:800;
  letter-spacing:.13em;
}

.btn.primary{
  background:#333631;
  color:#f7f5ee;
  border-color:#333631;
}

.btn:active{
  transform:translateY(1px);
}

#message{
  min-height:28px;
  padding-top:9px;
  text-align:center;
  font-family:Georgia,serif;
  font-style:italic;
  font-size:13px;
  color:#676960;
}

.bank{
  margin-top:13px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
}

.pill{
  padding:7px 11px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
}

.pill.c1{background:var(--sage)}
.pill.c2{background:var(--blue)}
.pill.c3{background:var(--ochre)}
.pill.c4{background:var(--mauve)}

.stats{
  margin-top:13px;
  display:flex;
  justify-content:center;
  gap:20px;
  color:#666860;
  font-size:9px;
  letter-spacing:.14em;
  font-weight:750;
}

.connection{
  display:none;
  margin-top:17px;
  padding-top:17px;
  border-top:1px solid rgba(65,66,60,.16);
  text-align:center;
}

.connection.show{
  display:block;
}

.connection-title{
  font-size:9px;
  font-weight:800;
  letter-spacing:.24em;
  color:#696b65;
}

.connection-copy{
  margin:7px 0 9px;
  font-family:Georgia,serif;
  font-size:16px;
}

.connection-words{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0;
}

.connection-length{
  height:23px;
  margin:7px 0 8px;
  font-size:20px;
  letter-spacing:.30em;
  font-weight:700;
  color:#555850;
}

.connection-input{
  width:min(230px,80%);
  border:0;
  border-bottom:1px solid #777970;
  border-radius:0;
  background:transparent;
  text-align:center;
  text-transform:uppercase;
  font-size:22px;
  font-weight:750;
  letter-spacing:.15em;
  color:#272925;
  outline:none;
  padding:7px;
}

.connection-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:12px;
}

.connection-actions .btn{
  padding:0 16px;
}

#connectionHint{
  min-height:39px;
  max-width:340px;
  margin:10px auto 0;
  font-family:Georgia,serif;
  font-style:italic;
  font-size:13px;
  line-height:1.35;
  color:#5f615a;
}

.final{
  display:none;
  text-align:center;
  padding:23px 8px 8px;
}

.final.show{
  display:block;
  animation:rise .8s ease both;
}

@keyframes rise{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

.final-kicker{
  font-size:9px;
  font-weight:800;
  letter-spacing:.24em;
  color:#686a63;
}

.final-title{
  margin-top:7px;
  font-family:Georgia,serif;
  font-size:26px;
}

.final-copy{
  max-width:310px;
  margin:8px auto;
  font-family:Georgia,serif;
  font-size:15px;
  line-height:1.45;
  color:#55574f;
}

.final-path{
  margin-top:14px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.15em;
  color:#555750;
}

.shake{
  animation:shake .28s linear;
}

@keyframes shake{
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-3px)}
}

/* landscape becomes fractionally clearer after completion */
body.complete .terrain{
  opacity:1;
  transition:opacity 1.4s ease;
}

@media(max-width:390px){
  .reel{height:61px}
  .letter.alt{font-size:16px}
  .letter.current{font-size:28px}
  #clue{font-size:17px}
}
</style>
</head>

<body>
<div id="world">

  <div class="terrain">
    <div class="contours"></div>
    <div class="basin"></div>
    <div class="growth"></div>
    <div class="track"></div>
    <div class="strata"></div>
  </div>

  <main class="wrap">

    <header class="mast">
      <div class="brand">WORDLOCK</div>
      <div class="place">Somewhere near the beginning</div>
      <div class="place-detail">Stone · water · first traces</div>
    </header>

    <section class="panel">

      <div class="progress">
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
      </div>

      <div id="gameArea">

        <div class="clue-label" id="clueLabel">CLUE 1</div>
        <div id="clue"></div>
        <div id="length"></div>

        <div class="board" id="board"></div>

        <div class="controls" id="controls">
          <button class="btn" id="resetBtn">RESET</button>
          <button class="btn primary" id="unlockBtn">UNLOCK</button>
          <button class="btn" id="hintBtn">HINT</button>
        </div>

        <div id="message"></div>

        <div class="bank" id="bank"></div>

        <div class="stats">
          <span id="turnStat">0 TURNS</span>
          <span id="attemptStat">0 ATTEMPTS</span>
          <span id="hintStat">0 HINTS</span>
        </div>

      </div>

      <section class="connection" id="connection">
        <div class="connection-title">CONNECT</div>
        <div class="connection-copy">
          What connects all four?
        </div>

        <div class="connection-words" id="connectionWords"></div>

        <div class="connection-length" id="connectionLength"></div>

        <input
          id="connectionInput"
          class="connection-input"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          maxlength="12"
          aria-label="Connecting word"
        >

        <div class="connection-actions">
          <button class="btn primary" id="connectBtn">CONNECT</button>
          <button class="btn" id="connectionHintBtn">HINT</button>
          <button class="btn" id="revealBtn">REVEAL</button>
        </div>

        <div id="connectionHint"></div>
      </section>

      <section class="final" id="final">
        <div class="final-kicker">A FIRST TRACE</div>
        <div class="final-title">The place remembers.</div>
        <div class="final-copy">
          Your path has become part of this place.
        </div>
        <div class="final-path" id="finalPath"></div>
      </section>

    </section>

  </main>
</div>

<script>
/* =========================================================
   WORDLOCK 017
   ========================================================= */

/*
   Fresh puzzle data.

   Important:
   - Three choices are visible at every place.
   - A successful word is found by an adjacent path.
   - Horizontal, vertical and diagonal adjacency all count.
   - No position may be used twice in one word.
*/

const PUZZLE = {

  wheels:[
    ["C","N","Q"],
    ["L","J","F"],
    ["A","H","D"],
    ["S","Q","I"],

    ["E","R","B"],
    ["Z","G","S"],
    ["K","R","S"],
    ["N","J","H"],

    ["T","U","E"],
    ["K","Q","D"],
    ["S","L","W"],
    ["P","O","B"],

    ["M","H","B"],
    ["Q","A","H"],
    ["C","T","I"],
    ["X","H","T"]
  ],

  clues:[
    {
      answer:"CLASS",
      clue:"A group learning together",
      start:0,
      colour:1
    },
    {
      answer:"BED",
      clue:"A place made ready for sleep",
      start:4,
      colour:2
    },
    {
      answer:"BATH",
      clue:"A place to soak in warm water",
      start:12,
      colour:3
    },
    {
      answer:"SHOW",
      clue:"A performance for an audience",
      start:3,
      colour:4
    }
  ],

  connection:{
    answer:"ROOM",

    /* Stage 1: relationship structure */
    hint1:"The connecting word comes after all four answers.",

    /* Stage 2: cryptic / associative */
    hint2:"Think of spaces with very different purposes.",

    /* Stage 3: deliberately much closer */
    hint3:"You might learn in one, sleep in one, wash in one — or visit one to see something displayed."
  }
};


/* =========================================================
   STATE
   ========================================================= */

let clueIndex = 0;

let current = PUZZLE.wheels.map(w => 1);
/* each value is the INDEX within that reel's 3 letters */

let clueSnapshot = [...current];

let remembered = PUZZLE.wheels.map(() => new Set());

let histories = PUZZLE.wheels.map(() => new Set());

let solvedWords = [];

let turns = 0;
let attempts = 0;
let hints = 0;

let connectionHintLevel = 0;

let audioReady = false;
let audioCtx = null;


/* =========================================================
   AUDIO
   Reliable activation occurs on first genuine interaction.
   ========================================================= */

function activateAudio(){
  if(audioReady) return;

  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;

  audioCtx = new AC();

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }

  audioReady = true;
}

document.addEventListener("pointerdown",activateAudio,{once:true});
document.addEventListener("touchstart",activateAudio,{once:true});


function tone(freq=220,duration=.06,volume=.035,type="sine"){
  if(!audioReady || !audioCtx) return;

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq,audioCtx.currentTime);

  gain.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    volume,
    audioCtx.currentTime+.008
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration+.02);
}

function moveSound(){
  tone(155,.045,.025,"sine");
}

function wrongSound(){
  tone(92,.12,.035,"sine");
}

function successSound(){
  tone(196,.12,.025);
  setTimeout(()=>tone(247,.15,.025),90);
}

function connectionSound(){
  tone(196,.18,.025);
  setTimeout(()=>tone(247,.20,.025),110);
  setTimeout(()=>tone(294,.28,.025),230);
}


/* =========================================================
   HELPERS
   ========================================================= */

function letterAt(i){
  return PUZZLE.wheels[i][current[i]];
}

function indexOfLetter(i,letter){
  return PUZZLE.wheels[i].indexOf(letter);
}

function adjacent(a,b){
  const ar=Math.floor(a/4);
  const ac=a%4;
  const br=Math.floor(b/4);
  const bc=b%4;

  return (
    Math.max(
      Math.abs(ar-br),
      Math.abs(ac-bc)
    ) === 1
  );
}


/* Find every currently displayed path spelling a word. */

function findPaths(word){
  const results=[];

  function walk(position,letterIndex,path){

    if(letterIndex === word.length){
      results.push([...path]);
      return;
    }

    for(let i=0;i<16;i++){

      if(path.includes(i)) continue;

      if(letterAt(i)!==word[letterIndex]) continue;

      if(position!==null && !adjacent(position,i)) continue;

      path.push(i);
      walk(i,letterIndex+1,path);
      path.pop();
    }
  }

  walk(null,0,[]);

  return results;
}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const board=document.getElementById("board");
  board.innerHTML="";

  PUZZLE.wheels.forEach((wheel,i)=>{

    const reel=document.createElement("div");
    reel.className="reel";

    applyHistoryClass(reel,i);

    const centre=current[i];

    const left=(centre+2)%3;
    const right=(centre+1)%3;

    const inner=document.createElement("div");
    inner.className="reel-inner";

    [
      {idx:left,kind:"alt"},
      {idx:centre,kind:"current"},
      {idx:right,kind:"alt"}
    ].forEach(item=>{

      const el=document.createElement("div");
      el.className="letter "+item.kind;

      const letter=wheel[item.idx];

      if(
        item.kind==="alt" &&
        remembered[i].has(letter)
      ){
        el.classList.add("remembered");
      }

      el.textContent=letter;
      inner.appendChild(el);
    });

    reel.appendChild(inner);

    /* swipe / drag */
    let startX=null;

    reel.addEventListener("pointerdown",e=>{
      activateAudio();
      startX=e.clientX;
      reel.setPointerCapture?.(e.pointerId);
    });

    reel.addEventListener("pointerup",e=>{
      if(startX===null) return;

      const dx=e.clientX-startX;
      startX=null;

      if(Math.abs(dx)<16) return;

      if(dx<0){
        turnReel(i,1);
      }else{
        turnReel(i,-1);
      }
    });

    board.appendChild(reel);
  });

  updateStats();
}


function applyHistoryClass(reel,i){

  const colours=[...histories[i]];

  if(colours.length===1){
    reel.classList.add("used"+colours[0]);
  }

  if(colours.length>=2){
    const a=Math.min(...colours);
    const b=Math.max(...colours);

    const mix="mix"+a+b;

    if([
      "mix12","mix13","mix14",
      "mix23","mix24","mix34"
    ].includes(mix)){
      reel.classList.add(mix);
    }else{
      reel.classList.add("used"+colours[colours.length-1]);
    }
  }
}


function turnReel(i,direction){

  activateAudio();

  current[i]=(current[i]+direction+3)%3;

  turns++;

  moveSound();

  render();
}


function renderClue(){

  const c=PUZZLE.clues[clueIndex];

  document.getElementById("clueLabel").textContent=
    "CLUE "+(clueIndex+1);

  document.getElementById("clue").textContent=c.clue;

  document.getElementById("length").textContent=
    c.answer.length+" LETTERS";

  document.getElementById("message").textContent="";

  render();

  /* Easy-mode starting-place pulse */
  setTimeout(()=>{
    const reels=document.querySelectorAll(".reel");
    reels[c.start]?.classList.add("pulse");
  },300);
}


/* =========================================================
   UNLOCK
   ========================================================= */

function unlock(){

  activateAudio();

  attempts++;

  const clue=PUZZLE.clues[clueIndex];
  const paths=findPaths(clue.answer);

  updateStats();

  if(!paths.length){
    wrongSound();

    document.getElementById("message").textContent=
      "Not quite. The place settles back.";

    document.querySelector(".panel").classList.add("shake");

    setTimeout(()=>{
      document.querySelector(".panel").classList.remove("shake");
      rollback();
    },520);

    return;
  }

  /*
     For this prototype, if more than one currently displayed
     path exists, favour the route containing the greatest
     number of selectors changed since the clue began.

     This is NOT being treated as the final production answer
     to route ownership. That remains a design problem.
  */

  let chosen=paths[0];

  if(paths.length>1){

    chosen=[...paths].sort((a,b)=>{

      const score=p=>
        p.reduce(
          (n,i)=>n+(current[i]!==clueSnapshot[i]?1:0),
          0
        );

      return score(b)-score(a);

    })[0];
  }

  solve(clue,chosen);
}


function solve(clue,path){

  successSound();

  path.forEach((position,n)=>{

    const letter=clue.answer[n];

    remembered[position].add(letter);
    histories[position].add(clue.colour);
  });

  solvedWords.push(clue.answer);

  document.getElementById("message").textContent=
    clue.answer+" found.";

  renderBank();
  render();

  document.querySelectorAll(".progress-dot")[clueIndex]
    .classList.add("done");

  clueIndex++;

  if(clueIndex>=PUZZLE.clues.length){

    setTimeout(showConnection,750);
    return;
  }

  /*
     Correct route remains.
     Irrelevant experiments return to clue-start state.
  */

  const next=[...clueSnapshot];

  path.forEach(i=>{
    next[i]=current[i];
  });

  current=next;
  clueSnapshot=[...current];

  setTimeout(renderClue,650);
}


function rollback(){

  current=[...clueSnapshot];
  render();

  setTimeout(()=>{
    document.getElementById("message").textContent="";
  },550);
}


function manualReset(){
  activateAudio();
  current=[...clueSnapshot];
  render();
  document.getElementById("message").textContent="";
}


/* =========================================================
   CLUE-STAGE HINT

   Still intentionally modest:
   pulse the starting place.
   It does not expose a constructor route.
   ========================================================= */

function clueHint(){

  hints++;
  updateStats();

  const clue=PUZZLE.clues[clueIndex];

  const reels=document.querySelectorAll(".reel");

  reels[clue.start]?.classList.remove("pulse");

  void reels[clue.start]?.offsetWidth;

  reels[clue.start]?.classList.add("pulse");

  document.getElementById("message").textContent=
    "Start here.";
}


/* =========================================================
   BANK
   ========================================================= */

function renderBank(){

  const bank=document.getElementById("bank");
  bank.innerHTML="";

  solvedWords.forEach((word,i)=>{

    const pill=document.createElement("div");
    pill.className="pill c"+(i+1);
    pill.textContent=word;

    bank.appendChild(pill);
  });
}


/* =========================================================
   CONNECTION
   ========================================================= */

function showConnection(){

  document.getElementById("controls").style.display="none";
  document.getElementById("clueLabel").style.display="none";
  document.getElementById("clue").style.display="none";
  document.getElementById("length").style.display="none";
  document.getElementById("message").textContent="";

  const section=document.getElementById("connection");
  section.classList.add("show");

  const words=document.getElementById("connectionWords");
  words.innerHTML="";

  solvedWords.forEach((word,i)=>{

    const pill=document.createElement("div");
    pill.className="pill c"+(i+1);
    pill.textContent=word;

    words.appendChild(pill);
  });

  /*
     IMPORTANT:
     The number of dots now genuinely equals
     the number of letters in the Connection.
  */

  document.getElementById("connectionLength").textContent=
    "•".repeat(PUZZLE.connection.answer.length);

  setTimeout(()=>{
    document.getElementById("connectionInput").focus();
  },350);
}


function connectionHint(){

  activateAudio();

  if(connectionHintLevel>=3) return;

  connectionHintLevel++;
  hints++;
  updateStats();

  const text=
    PUZZLE.connection[
      "hint"+connectionHintLevel
    ];

  document.getElementById("connectionHint").textContent=text;

  if(connectionHintLevel===3){
    document.getElementById("connectionHintBtn").textContent=
      "NO MORE HINTS";
  }
}


function tryConnection(){

  activateAudio();

  const input=document.getElementById("connectionInput");
  const guess=input.value.trim().toUpperCase();

  if(!guess) return;

  attempts++;
  updateStats();

  if(guess===PUZZLE.connection.answer){

    completeConnection(false);

  }else{

    wrongSound();

    input.classList.add("shake");

    document.getElementById("connectionHint").textContent=
      "That doesn't connect all four.";

    setTimeout(()=>{
      input.classList.remove("shake");
    },350);
  }
}


function revealConnection(){

  activateAudio();

  const answer=PUZZLE.connection.answer;

  document.getElementById("connectionInput").value=answer;

  document.getElementById("connectionHint").textContent=
    "There it is.";

  setTimeout(()=>{
    completeConnection(true);
  },500);
}


function completeConnection(revealed){

  connectionSound();

  const answer=PUZZLE.connection.answer;

  document.getElementById("connectionInput").disabled=true;

  document.getElementById("connectBtn").disabled=true;
  document.getElementById("connectionHintBtn").disabled=true;
  document.getElementById("revealBtn").disabled=true;

  document.getElementById("connectionLength").textContent=answer;

  document.getElementById("connectionHint").textContent=
    solvedWords.map(word=>word+" "+answer).join("  ·  ");

  setTimeout(()=>{
    finish(revealed);
  },1000);
}


/* =========================================================
   FINISH
   ========================================================= */

function finish(revealed){

  document.body.classList.add("complete");

  document.getElementById("connection").style.display="none";

  const visited=
    histories.filter(set=>set.size>0).length;

  document.getElementById("finalPath").textContent=
    "YOUR PATH · "+visited+" OF 16 PLACES VISITED";

  document.getElementById("final").classList.add("show");
}


/* =========================================================
   STATS
   ========================================================= */

function updateStats(){

  document.getElementById("turnStat").textContent=
    turns+" TURN"+(turns===1?"":"S");

  document.getElementById("attemptStat").textContent=
    attempts+" ATTEMPT"+(attempts===1?"":"S");

  document.getElementById("hintStat").textContent=
    hints+" HINT"+(hints===1?"":"S");
}


/* =========================================================
   BUTTONS
   ========================================================= */

document.getElementById("unlockBtn")
  .addEventListener("click",unlock);

document.getElementById("resetBtn")
  .addEventListener("click",manualReset);

document.getElementById("hintBtn")
  .addEventListener("click",clueHint);

document.getElementById("connectBtn")
  .addEventListener("click",tryConnection);

document.getElementById("connectionHintBtn")
  .addEventListener("click",connectionHint);

document.getElementById("revealBtn")
  .addEventListener("click",revealConnection);

document.getElementById("connectionInput")
  .addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      tryConnection();
    }
  });


/* =========================================================
   START
   ========================================================= */

renderClue();

</script>
</body>
</html>
